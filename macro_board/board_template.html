      <li>Weekly-released series become visible only on their release day: ${esc(Object.keys(B.settings.fred_release_calendar||{}).filter(k=>k!=="rationale").join(", ")||"none")} (Fed H.10, the Monday after the observation week; Tuesday after a federal holiday).</li>
      <li>A series older than its freshness limit becomes MISSING. It is never carried forward or treated as neutral.</li>
      <li>Today's MISSING conditions are left out of the analog match. A past session's MISSING never counts as a match.</li>
      <li>Forward returns run from the next session's open to the close ${B.horizons.join("/")} sessions later.</li></ul></div>
    <div class="card"><h3>From evidence to lean</h3><ul class="list">
      <li>Analog sessions: past sessions agreeing with today on at least the chosen match level of observed conditions (${E.analog_match_levels.map(x=>Math.round(x*100)+"%").join(" → ")}, loosened until ≥ ${E.analog_target_effective_n} independent windows).</li>
      <li>Overlapping windows are thinned, so “windows” counts independent observations.</li>
      <li>The lean is fitted on history before the last ${Math.round(E.holdout_fraction*100)}%: it needs ≥ ${E.min_effective_n} windows, |t| ≥ ${E.lean_t_min} and |mean| ≥ ${esc(JSON.stringify(E.lean_min_abs_mean_pct))}%. Otherwise it shows “No clear lean”.</li>
      <li>The held-out quarter then shows whether the direction survived on data it never saw.</li>
      <li>ETFs need ≥ ${E.min_history_sessions} sessions of history for evidence.</li></ul></div>
    <div class="card"><h3>Decision aids (thesis review, 6 Oct)</h3><ul class="list">
      <li><b>80% interval</b>: Student-t interval for the analog mean on independent windows. The window minimum is a label, not a rule.</li>
      <li><b>Price-only lean</b>: the same rule applied to all history, with no macro. Compare it with the macro lean to see what macro adds.</li>
      <li><b>Path-dependent</b>: leveraged, inverse and volatility products show no 5d or 20d lean.</li>
      <li><b>Move made</b>: return over 5 and 20 sessions in units of the ETF's own 20-session realised vol (beyond ±${B.settings.extension.band_sd}σ = extended). It describes the run; whether runs like it continued or stalled is <i>measured</i> per ETF under Momentum history, never assumed. Since 2021, runs in SPY and QQQ have more often continued.</li>
      <li><b>Desk card</b>: the six desk questions filled from the board for each pipeline candidate and index ETF, with checks (macro lean, momentum, room left, option price, data, event risk) that describe evidence. When measured continuation exceeds the room left, the card says the pipeline target may be stale. The trader records Act / Wait / Skip and the reason.</li>
      <li><b>Response</b>: conditions in today's state with a measured contrast of |t| ≥ ${B.settings.response.t_min} count as headwinds or tailwinds for that ETF. The label compares their balance with the ETF's own return over the window. It is descriptive only.</li>
      <li><b>Priced vs history</b>: executable ATM straddle mid on the first expiry covering the horizon, scaled by √time, divided by the analog mean absolute move.</li>
      <li><b>Pipeline</b>: rows from the newest run with <code>${esc(B.settings.options ? "options/options_candidates_ranked.csv" : "")}</code>, shown read-only.</li>
      <li><b>Holdings</b>: issuer daily files (State Street for SPY/DIA, Invesco for QQQ), downloaded on <code>--refresh</code> and archived raw. Contribution = weight × return; participation = share of priced weight above its ${B.settings.holdings.participation_sessions}-session mean.</li>
      <li><b>tastytrade</b>: IV index/rank/percentile, HV, beta and the IV term structure, read-only through <code>bridge.tastytrade_readonly_mcp</code>. IV-implied |move| = IV × √(h/252) × √(2/π).</li>
      <li><b>Inputs</b>: each build archives a content-addressed copy of every file it read (${B.inputs_archived ?? 0} this build) in <code>output/inputs</code>, with the manifest in the day's snapshot.</li></ul></div>
    <div class="card"><h3>Limits</h3><ul class="list">
      <li>About five years of daily history (from 2021-08), so one rate cycle. Analog sets are small and the evidence is thin by construction.</li>
      <li>FRED history is the latest vintage. Market series (yields, FX, H.4.1) are not revised; monthly prints are shown only, never used as conditions.</li>
      <li>Breadth uses the price store's own ticker universe, which grows over time.</li>
      <li>All thresholds are provisional. The board's own scorecard is how they get validated.</li></ul></div>
  </div>`;
}

/* ---------- sector rotation ---------- */
state.rotSet = state.rotSet || "sector";
const Q_TXT = {LEADING:"Leading", WEAKENING:"Weakening", LAGGING:"Lagging", IMPROVING:"Improving", MISSING:"Missing"};
const qChip = (q, extra) => `<span class="qchip q-${esc(q)}">${esc(Q_TXT[q] || q)}${extra ? ` <span class="muted">${extra}</span>` : ""}</span>`;
function rrgSvg(rows){
  const pts = rows.flatMap(r => r.tail.map(p => [p.trend, p.momentum]));
  if (!pts.length) return `<div class="sub muted">No rotation history.</div>`;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const spanX = Math.max(2, ...xs.map(x => Math.abs(x - 100))) * 1.12, spanY = Math.max(1, ...ys.map(y => Math.abs(y - 100))) * 1.12;
  const W = 640, H = 460, L = 44, R = 14, T = 14, Bm = 36;
  const X = x => L + (W - L - R) * (x - (100 - spanX)) / (2 * spanX);
  const Y = y => T + (H - T - Bm) * (1 - (y - (100 - spanY)) / (2 * spanY));
  const quad = (x0, y0, x1, y1, q, lx, ly, anchor) => `<rect x="${Math.min(X(x0),X(x1))}" y="${Math.min(Y(y0),Y(y1))}" width="${Math.abs(X(x1)-X(x0))}" height="${Math.abs(Y(y1)-Y(y0))}" class="q-${q}" style="fill:color-mix(in oklab, var(--q) 7%, var(--surface))"/>
    <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="12" font-weight="600" class="q-${q}" style="fill:var(--q)">${Q_TXT[q]}</text>`;
  let g = quad(100, 100, 100 + spanX, 100 + spanY, "LEADING", W - R - 6, T + 16, "end")
        + quad(100, 100 - spanY, 100 + spanX, 100, "WEAKENING", W - R - 6, H - Bm - 8, "end")
        + quad(100 - spanX, 100 - spanY, 100, 100, "LAGGING", L + 6, H - Bm - 8, "start")
        + quad(100 - spanX, 100, 100, 100 + spanY, "IMPROVING", L + 6, T + 16, "start");
  g += `<line x1="${X(100)}" x2="${X(100)}" y1="${T}" y2="${H-Bm}" stroke="var(--border)"/><line x1="${L}" x2="${W-R}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--border)"/>`;
  g += `<text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--text-2)">RS trend vs SPY (100 = at its ${B.rotation.settings.trend_sessions}-session average) →</text>`;
  g += `<text x="12" y="${(T+H-Bm)/2}" text-anchor="middle" font-size="12" fill="var(--text-2)" transform="rotate(-90 12 ${(T+H-Bm)/2})">RS momentum (${B.rotation.settings.momentum_sessions}-session change) →</text>`;
  rows.forEach(r => {
    const t = r.tail; if (!t.length) return;
    const d = t.map((p, i) => (i ? "L" : "M") + X(p.trend).toFixed(1) + " " + Y(p.momentum).toFixed(1)).join("");
    const head = t[t.length - 1];
    g += `<g class="q-${esc(r.quadrant)}"><path d="${d}" fill="none" stroke="var(--q)" stroke-width="1.6" stroke-opacity=".55"/>`
      + t.slice(0, -1).map(p => `<circle cx="${X(p.trend)}" cy="${Y(p.momentum)}" r="2.2" fill="var(--q)" fill-opacity=".45"/>`).join("")
      + `<circle cx="${X(head.trend)}" cy="${Y(head.momentum)}" r="5.5" fill="var(--q)" stroke="var(--surface)" stroke-width="2"/>`
      + `<text x="${X(head.trend) + 8}" y="${Y(head.momentum) + 4}" font-size="11.5" font-weight="600" fill="var(--text)">${esc(r.ticker)}</text>`
      + `<circle cx="${X(head.trend)}" cy="${Y(head.momentum)}" r="12" fill="transparent" data-tip="${esc(`<b>${esc(r.ticker)}</b> ${esc(r.sector_name||"")}<br>${esc(Q_TXT[r.quadrant])} for ${r.sessions_in_quadrant} sessions<br>RS trend ${fmt(r.trend,2)} · momentum ${fmt(r.momentum,2)}<br>vs SPY: 5d ${pct(r.rel_5d)} · 20d ${pct(r.rel_20d)} · 60d ${pct(r.rel_60d)}<br>Tail: weekly points ${esc(t[0].session)} → ${esc(head.session)}`)}"/></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:760px;height:auto;display:block" role="img" aria-label="Relative rotation map">${g}</svg>`;
}
function renderRotation(){
  const R = B.rotation; if (!R) { $("#p-rotation").innerHTML = `<div class="sub muted">Rotation not built.</div>`; return; }
  const h = state.horizon;
  const rows = R.rows.filter(r => r.kind === state.rotSet);
  const evOf = r => r.relative_evidence[h] || {};
  const table = rows.map(r => { const e = evOf(r), a = e.analog || {};
    const agree = r.packet_agreement?.[h];
    return `<tr class="row" data-t="${esc(r.ticker)}"><td><b>${esc(r.ticker)}</b> <span class="muted">${esc((r.sector_name||"").toLowerCase())}</span></td>
      <td class="l">${qChip(r.quadrant, r.sessions_in_quadrant + "d")}</td><td>${fmt(r.trend,1)}</td><td>${fmt(r.momentum,1)}</td>
      <td class="${cls(r.rel_5d)}">${pct(r.rel_5d,1)}</td><td class="${cls(r.rel_20d)}">${pct(r.rel_20d,1)}</td><td class="${cls(r.rel_60d)}">${pct(r.rel_60d,1)}</td>
      <td>${isNum(r.participation_pct) ? Math.round(r.participation_pct) + "%" : "—"}</td><td class="l muted">${esc((r.top_contributors_20d||[]).join(", "))}</td>
      <td class="l">${leanChip(e)} ${holdChip(e.holdout)}</td><td class="${cls(a.mean_pct)}">${pct(a.mean_pct)}</td><td class="muted">${ci(a)}</td>
      <td class="l">${r.packet_bias ? `<span class="chip ${r.packet_bias==="TAILWIND"?"up":r.packet_bias==="HEADWIND"?"down":"na"}">${words(r.packet_bias)}</span>` : "—"} ${agree ? `<span class="chip ${agree==="AGREES"?"":"na"}">${agree==="AGREES"?"✓ agrees":agree==="DISAGREES"?"✗ disagrees":"unmeasured"}</span>` : ""}</td></tr>`; }).join("");
  // macro-conditional ranking
  const ranked = rows.map(r => ({r, a: evOf(r).analog || {}, e: evOf(r)})).filter(x => isNum(x.a.mean_pct)).sort((x, y) => y.a.mean_pct - x.a.mean_pct);
  const cap = Math.max(0.5, ...ranked.flatMap(x => [Math.abs(x.a.ci_low_pct ?? 0), Math.abs(x.a.ci_high_pct ?? 0), Math.abs(x.a.mean_pct)]));
  const pos = v => 50 + 50 * Math.max(-1, Math.min(1, v / cap));
  const rank = ranked.map(x => { const a = x.a; const v = a.mean_pct;
    return `<div><b>${esc(x.r.ticker)}</b> <span class="muted" style="font-size:11px">${esc(LEAN_TXT[x.e.lean]||x.e.lean)}</span></div>
      <div class="track" data-tip="${esc(`<b>${esc(x.r.ticker)} vs SPY · next ${h} session(s) after sessions like today</b><br>Mean ${pct(v)} · 80% interval ${ci(a)}<br>Beat SPY ${isNum(a.hit_rate)?Math.round(100*a.hit_rate)+"%":"—"} · ${a.n_eff} independent windows<br>All history: ${pct(x.e.base?.mean_pct)}`)}">
        ${isNum(a.ci_low_pct) && isNum(a.ci_high_pct) ? `<span style="position:absolute;top:6px;height:2px;left:${pos(a.ci_low_pct)}%;width:${pos(a.ci_high_pct)-pos(a.ci_low_pct)}%;background:var(--text-2);opacity:.5"></span>` : ""}
        <span class="bar" style="left:${Math.min(pos(0),pos(v))}%;width:${Math.max(0.8,Math.abs(pos(v)-pos(0)))}%;background:${v>=0?"var(--up)":"var(--down)"}"></span></div>
      <div class="num ${cls(v)}" style="text-align:right">${pct(v)}</div>`; }).join("");
  // sector x condition (relative)
  const keys = B.conditions.meta.map(m => m.key);
  const allV = rows.flatMap(r => keys.map(k => Math.abs(r.relative_sensitivity[h]?.[k]?.excess_pct || 0))).filter(isNum).sort((a,b)=>a-b);
  const hcap = Math.max(0.2, allV[Math.floor(allV.length*0.95)] || 1);
  let heat = `<div class="heat" style="grid-template-columns:minmax(64px,80px) repeat(${keys.length}, minmax(44px,1fr))"><div></div>` + keys.map(k => `<div class="colh">${esc(condMeta[k].label)}: ${words(B.conditions.current[k])}</div>`).join("");
  rows.forEach(r => { heat += `<div class="lab"><b>${esc(r.ticker)}</b></div>` + keys.map(k => { const c = r.relative_sensitivity[h]?.[k] || {}; const v = c.excess_pct; const weak = !isNum(c.t) || Math.abs(c.t) < 1;
    return `<div class="cell ${weak?"weak":""}" style="background:${divergingColor(v, hcap)}" data-tip="${esc(`<b>${esc(r.ticker)} vs SPY · ${esc(condMeta[k].label)} = ${words(c.state)}</b><br>Excess ${h}d relative return in this state: ${pct(v)}<br>t ${fmt(c.t)} · ${c.n_eff_in ?? 0} independent windows`)}">${isNum(v) ? (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1)) : "×"}</div>`; }).join(""); });
  heat += `</div>`;
  // quadrant evidence + transitions
  const QE = R.quadrant_evidence[h] || {};
  const qe = ["LEADING","WEAKENING","LAGGING","IMPROVING","ALL"].map(q => { const x = QE[q] || {};
    return `<tr><td class="l">${q==="ALL" ? "<b>All sessions</b>" : qChip(q)}</td><td class="${cls(x.mean_pct)}">${pct(x.mean_pct)}</td><td class="muted">${ci({ci_low_pct:x.ci_low_pct, ci_high_pct:x.ci_high_pct})}</td><td>${isNum(x.beat_rate)?Math.round(100*x.beat_rate)+"%":"—"}</td><td>${x.n_eff ?? 0}</td></tr>`; }).join("");
  const T = R.transitions;
  const trans = ["LEADING","WEAKENING","LAGGING","IMPROVING"].map(a => { const row = T[a] || {}; const tot = Object.values(row).reduce((s,v)=>s+v,0);
    return `<tr><td class="l">${qChip(a)}</td>${["LEADING","WEAKENING","LAGGING","IMPROVING"].map(b => `<td style="${a===b?"font-weight:650":""}">${tot ? Math.round(100*row[b]/tot)+"%" : "—"}</td>`).join("")}<td class="muted">${tot}</td></tr>`; }).join("");
  // packet scorecard
  const P = R.packet || {}, LL = R.lead_lag_scorecard || {};
  const llRows = B.horizons.map(hh => { const x = (LL.results||{})[String(hh)] || {}; const thin = (x.n_eff||0) < B.settings.evidence.min_effective_n;
    return `<tr><td>${hh}d</td><td>${x.n ?? 0}</td><td class="${thin?"muted":""}">${x.n_eff ?? 0}${thin?" ?":""}</td><td>${isNum(x.hit_rate)?Math.round(100*x.hit_rate)+"%":"—"}</td><td class="${cls(x.mean_spread_pct)}">${pct(x.mean_spread_pct)}</td></tr>`; }).join("");
  $("#p-rotation").innerHTML = `<h2>Sector rotation <span class="sub">relative strength vs SPY and the macro's measured impact on it</span></h2>
    <div class="controls">${horizonSeg("hz-rot")} <span class="seg" id="rot-set"><button data-s="sector" aria-pressed="${state.rotSet==="sector"}">SPDR sectors</button><button data-s="industry" aria-pressed="${state.rotSet==="industry"}">Industries & themes</button></span></div>
    <div class="grid g-2">
      <div class="card"><h3>Rotation map <span class="sub">weekly tail, last ${B.rotation.settings.tail_points} points</span></h3>${rrgSvg(rows)}
        <div class="legend">${["LEADING","WEAKENING","LAGGING","IMPROVING"].map(q => qChip(q)).join(" ")}</div>
        <div class="note">Transparent approximation of a relative-rotation graph, not the proprietary JdK RS-Ratio. RS trend = 100 × (ETF/SPY) ÷ its ${B.rotation.settings.trend_sessions}-session mean. RS momentum = 100 × RS trend ÷ its value ${B.rotation.settings.momentum_sessions} sessions earlier. Sectors usually move clockwise: improving → leading → weakening → lagging.</div></div>
      <div class="card"><h3>Macro-conditional ranking · next ${h} session(s) vs SPY</h3>
        <div class="sub" style="margin-bottom:6px">Mean return relative to SPY after past sessions whose macro conditions matched today's (${Math.round(B.analogs.match_level*100)}% match, ${B.analogs.count} sessions). The whisker is the 80% interval.</div>
        <div class="bars" style="grid-template-columns:minmax(90px,150px) 1fr 70px">${rank || `<div class="sub muted">No measurable sectors.</div>`}</div>
        <div class="note">Each lean uses relative thresholds (|mean| ≥ ${Object.entries(B.rotation.settings.relative_lean_min_abs_mean_pct).map(([k,v]) => v + "% at " + k + "d").join(", ")}, |t| ≥ ${B.settings.evidence.lean_t_min}) and is checked on held-out history.</div></div>
    </div>
    <h2>Rotation table</h2>
    <div class="table-wrap"><table><thead><tr><th>ETF</th><th class="l">Quadrant</th><th>RS trend</th><th>Momentum</th><th>vs SPY 5d</th><th>20d</th><th>60d</th><th>Participation</th><th class="l">Leading holdings 20d</th><th class="l">Macro lean ${h}d</th><th>Analog vs SPY</th><th>80% interval</th><th class="l">Packet bias</th></tr></thead><tbody>${table}</tbody></table></div>
    <div class="note">Participation = share of the ETF's weight (issuer daily holdings) trading above its ${B.settings.holdings.participation_sessions}-session mean. "Packet bias" is the LLM packet's sector_bias_map, compared with the measured macro lean: ✓ agrees, ✗ disagrees, or unmeasured when the evidence shows no clear lean.</div>
    <h2>Macro impact on sectors · ${h}-session relative returns</h2>
    <div class="card" style="overflow:auto">${heat}</div>
    <div class="note">Cell = mean ${h}-session return relative to SPY while the condition sat in today's state, minus the same in the condition's other states. Blue = the sector did better relative to SPY. Faded = |t| &lt; 1.</div>
    <div class="grid g-2" style="margin-top:10px">
      <div class="card"><h3>Does the quadrant predict the next ${h} session(s)?</h3>
        <table class="mini" style="width:100%"><thead><tr><th class="l">Quadrant</th><th>Mean vs SPY</th><th>80% interval</th><th>Beat SPY</th><th>Windows</th></tr></thead><tbody>${qe}</tbody></table>
        <div class="note">Pooled over the 11 SPDR sectors since 2021. Compare each quadrant with "All sessions": over this period sectors lagged SPY on average, because SPY is concentrated in mega-cap tech.</div></div>
      <div class="card"><h3>Where quadrants go next (${B.rotation.settings.transition_step_sessions} sessions later)</h3>
        <table class="mini" style="width:100%"><thead><tr><th class="l">From → to</th><th>Leading</th><th>Weakening</th><th>Lagging</th><th>Improving</th><th>n</th></tr></thead><tbody>${trans}</tbody></table>
        <div class="note">Measured transition rates for the 11 SPDR sectors. Bold = stayed in the same quadrant.</div></div>
      <div class="card"><h3>LLM packet sector calls</h3>
        <div class="sub">Rotation signal <b>${words(P.signal)}</b> · strongest ${esc((P.strongest||[]).join(", ")||"—")} · weakest ${esc((P.weakest||[]).join(", ")||"—")} ${uncal}</div>
        <table class="mini" style="width:100%;margin-top:6px"><thead><tr><th class="l">H</th><th>Calls</th><th>Windows</th><th>Lead beat lag</th><th>Mean spread</th></tr></thead><tbody>${llRows}</tbody></table>
        <details style="margin-top:6px"><summary>Latest archived calls</summary><ul class="list">${(LL.latest||[]).map(c => `<li>${esc(c.entry_session)}: lead ${esc(c.lead.join(", "))} · lag ${esc(c.lag.join(", "))}</li>`).join("")}</ul></details>
        <div class="note">Scored from each archived generation's leading_sectors vs lagging_sectors (latest wins per session): equal-weight lead basket minus lag basket, next open → close.</div></div>
    </div>`;
  bindHorizon("hz-rot");
  $("#rot-set").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.rotSet = b.dataset.s; renderRotation(); };
  $("#p-rotation tbody").onclick = e => { const tr = e.target.closest("tr.row"); if (tr && B.etfs[tr.dataset.t]) openDrawer(tr.dataset.t); };
}

/* ---------- momentum + desk card ---------- */
const MOM_TXT = {UP_5_PLUS:"5+ up closes in a row", UP_3_4:"3–4 up closes in a row", UP_1_2:"1–2 up closes", DOWN_1_2:"1–2 down closes", DOWN_3_4:"3–4 down closes in a row", DOWN_5_PLUS:"5+ down closes in a row", UNCHANGED:"unchanged close", EXTENDED_UP:"extended up (≥1.5σ)", EXTENDED_DOWN:"extended down (≤−1.5σ)", NOT_EXTENDED:"not extended", MISSING:"missing"};
function evRow(label, x){
  const a = x?.analog || {};
  return `<tr><td class="l">${label}</td><td class="l">${leanChip(x)} ${holdChip(x?.holdout)}</td><td class="${cls(a.mean_pct)}">${pct(a.mean_pct)}</td><td class="muted">${ci(a)}</td><td>${isNum(a.hit_rate)?Math.round(100*a.hit_rate)+"%":"—"}</td><td>${a.n_eff ?? "—"}</td></tr>`;
}
function momentumTable(t, hz){
  const m = (B.etfs[t] || {}).momentum; if (!m || m.status !== "OK") return "";
  const h = hz || state.horizon; const E = m.evidence || {}; const base = ((B.etfs[t].evidence || {})[h] || {}).base || {};
  return `<h3 style="margin-top:12px">Momentum history · next ${h} session(s)</h3>
    <div class="sub">Now: ${esc(MOM_TXT[m.current.streak] || m.current.streak)} (streak ${m.streak > 0 ? "+" : ""}${m.streak}) · 5d ${fmt(m.z?.["5"],2)}σ · 20d ${fmt(m.z?.["20"],2)}σ. What ${t} did next after the same state, against ${pct(base.mean_pct)} for all sessions.</div>
    <table class="mini" style="width:100%;margin-top:4px"><thead><tr><th class="l">After…</th><th class="l">Lean</th><th>Mean</th><th>80% interval</th><th>Up</th><th>Windows</th></tr></thead><tbody>
      ${evRow(esc(MOM_TXT[m.current.streak] || m.current.streak), (E.streak||{})[h])}
      ${evRow("5d move " + esc(MOM_TXT[m.current.ext5] || m.current.ext5), (E.ext5||{})[h])}
      ${evRow("20d move " + esc(MOM_TXT[m.current.ext20] || m.current.ext20), (E.ext20||{})[h])}
    </tbody></table>
    <div class="note">An extended move is judged by what followed similar runs for this ETF, not assumed to be late. Since 2021, runs in SPY and QQQ have more often continued than stalled.</div>`;
}
const CK_CLASS = {SUPPORTS:"good", OK:"good", CAUTION:"warn", CONFLICTS:"bad", AGAINST:"bad", NO_EVIDENCE:"", NO_PROPOSAL:"", UNKNOWN:""};
const CK_ICON = {good:"✓", warn:"!", bad:"×", "":"–"};
const CK_LABEL = {macro_lean:"Macro lean", momentum:"Momentum (streak)", momentum_ext20:"Momentum (20d move)", entry_room:"Room left", option_price:"Option price", data:"Data", event_risk:"Event risk"};
const ckChip = (key, c) => { const k = CK_CLASS[c?.status] ?? ""; return `<span class="ck ${k}" data-tip="${esc(`<b>${CK_LABEL[key]}: ${words(c?.status)}</b><br>${esc(c?.text || "")}${c?.note ? "<br><br>" + esc(c.note) : ""}`)}"><i aria-hidden="true">${CK_ICON[k]}</i>${CK_LABEL[key]} · ${words(c?.status)}</span>`; };
state.deskTicker = state.deskTicker || null; state.deskH = null;
function deskKey(t){ return `macroBoardDesk:${B.as_of_session}:${t}`; }
function renderDesk(){
  const cards = B.desk_cards || {}; const names = Object.keys(cards);
  if (!names.length) { $("#p-desk").innerHTML = `<div class="sub muted">No desk cards built.</div>`; return; }
  if (!state.deskTicker || !cards[state.deskTicker]) state.deskTicker = names[0];
  const t = state.deskTicker, D = cards[t];
  const h = state.deskH && D.by_horizon[state.deskH] ? state.deskH : D.default_horizon;
  const C = D.by_horizon[h]; const e = B.etfs[t]; const m = e.metrics || {}; const P = C.q4_pipeline || {};
  const candBtn = n => { const p = B.etfs[n]?.pipeline; const d = p?.canonical_direction;
    return `<button data-t="${esc(n)}" aria-pressed="${n===t}">${esc(n)} ${d==="CALL"?"▲":d==="PUT"?"▼":"·"}</button>`; };
  const focus = names.filter(n => B.focus.includes(n)), others = names.filter(n => !B.focus.includes(n));
  const q1 = C.q1_changed || {}, q2 = C.q2_affects || {}, q3 = C.q3_market || {}, q5 = C.q5_entry || {}, q6 = C.q6_change_mind || {};
  const ck = C.checks || {};
  const close = m.close;
  const distTo = lvl => isNum(lvl) && isNum(close) ? pct((lvl / close - 1) * 100, 2) : "—";
  const trig = (B.intel.usmi || {}).forward_triggers || {};
  const trigList = Object.entries(trig).slice(0, 2).map(([k, v]) => `<li><b>${words(k)}</b>: ${esc((Array.isArray(v) ? v : [v]).slice(0, 2).join(" · "))}</li>`).join("");
  let draft = {}; try { draft = JSON.parse(localStorage.getItem(deskKey(t)) || "{}"); } catch(err) {}
  const opt = (v, label) => `<label class="opt"><input type="radio" name="dk-decision" value="${v}" ${draft.decision===v?"checked":""}> ${label}</label>`;
  const template = `Against [backdrop], [new information] affects ${t} through [mechanism]. The market is [response]. The pipeline proposes [trade]. At [price] there is [room left] against [risk]. I will [act / wait / skip] because [reason]. I will change my mind if [condition].`;
  $("#p-desk").innerHTML = `<h2>Desk decision card <span class="sub">the six desk questions answered from the board · checks describe evidence, you decide</span></h2>
    <div class="card soft"><div class="sub" style="margin-bottom:6px">Pipeline candidates (▲ call · ▼ put) and the index ETFs</div>
      <div class="cand" id="dk-cand">${focus.map(candBtn).join("")} <span class="sub" style="align-self:center">·</span> ${others.map(candBtn).join("")}</div></div>
    <div class="card" style="margin-top:10px">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline">
        <div><span class="state" style="font-size:22px">${esc(t)}</span> <span class="sub">${esc(groupOf(t))} · close ${fmt(close)} (${esc(m.last_session)})</span> ${pipeChip(e.pipeline)}</div>
        <div class="seg" id="dk-h">${B.horizons.map(x => `<button data-h="${x}" aria-pressed="${String(x)===h}">${x}d${String(x)===D.default_horizon?" ·pipeline":""}</button>`).join("")}</div>
      </div>
      <div class="pill-row" style="margin-top:10px;gap:6px">${Object.keys(CK_LABEL).map(k => ckChip(k, ck[k])).join("")}</div>
      ${ck.entry_room?.note ? `<div class="warnbox" style="margin-top:8px">${esc(ck.entry_room.note)}</div>` : ""}
    </div>
    <div class="deskgrid" style="margin-top:10px">
      <div class="card deskq"><h3>1 · What changed? <small>new information since the last sessions</small></h3>
        <ul class="list">${(q1.conditions||[]).map(c => `<li>${esc(c.session)}: ${esc(condMeta[c.condition]?.label || c.condition)} ${words(c.from)} → <b>${words(c.to)}</b></li>`).join("") || "<li class='muted'>No condition changes.</li>"}
        ${(q1.events||[]).map(x => `<li>Event: ${esc(x)}</li>`).join("")}<li>News alert: ${words(q1.news_alert)} ${uncal}</li></ul></div>
      <div class="card deskq"><h3>2 · What should it affect? <small>measured for ${esc(t)}, ${h}d</small></h3>
        <ul class="list">${(q2.measured||[]).map(x => `<li>${esc(x.condition)} = ${words(x.state)}: <span class="${cls(x.excess_pct)}">${pct(x.excess_pct)}</span> vs other states (t ${fmt(x.t)})</li>`).join("") || "<li class='muted'>No condition with |t| ≥ 1 for this ETF and horizon.</li>"}
        ${(q2.holdings_leaders||[]).length ? `<li>Holdings leading ${h}d: ${esc(q2.holdings_leaders.join(", "))}</li>` : ""}</ul></div>
      <div class="card deskq"><h3>3 · What is the market doing?</h3>
        <dl class="kv"><dt>Response (${h}d)</dt><dd>${respChip((e.decision?.response||{})[h])}</dd>
        <dt>vs SPY, 20d</dt><dd class="${cls(q3.rs_vs_spy_20d)}">${pct(q3.rs_vs_spy_20d)}</dd>
        <dt>Streak</dt><dd>${isNum(q3.streak) ? (q3.streak > 0 ? "+" : "") + q3.streak + " closes" : "—"} · ${esc(MOM_TXT[q3.momentum_states?.streak] || "")}</dd>
        <dt>Move vs own vol</dt><dd>5d ${fmt(q3.z?.["5"],2)}σ · 20d ${fmt(q3.z?.["20"],2)}σ</dd>
        <dt>Participation</dt><dd>${isNum(q3.participation_pct) ? Math.round(q3.participation_pct) + "% of weight above trend" : "—"}</dd></dl></div>
      <div class="card deskq"><h3>4 · What does the pipeline propose?</h3>
        ${P.canonical_direction ? `<dl class="kv"><dt>Direction · verdict</dt><dd>${esc(P.canonical_direction)} · ${words(P.options_verdict)}</dd>
        <dt>Entry · target · invalidation</dt><dd>${fmt(P.entry_spot)} · ${fmt(P.target_spot)} · ${fmt(P.invalidation_spot)}</dd>
        <dt>Trigger · horizon</dt><dd>${words(P.trigger_state)} · ${words(P.horizon_bucket)}</dd>
        <dt>Contract</dt><dd>${P.contract_strike ? `${fmt(P.contract_strike,1)} exp ${esc(P.contract_expiry)} (${esc(P.contract_dte)}d) · ${fmt(P.contract_premium)}` : "—"}</dd>
        <dt>Stand-down reason</dt><dd style="text-align:left">${esc(P.stand_down_reason || "—")}</dd></dl>` : `<div class="sub muted">No row for ${esc(t)} in the latest full run (${esc(B.pipeline?.run_id||"none")}).</div>`}
        <div class="note">Run ${esc(B.pipeline?.run_id || "—")}, read-only.</div></div>
      <div class="card deskq"><h3>5 · Is the entry still worth taking? <small>from today's close</small></h3>
        <ul class="list"><li>${ckChip("entry_room", ck.entry_room)} ${esc(ck.entry_room?.text || "")}</li>
        <li>${ckChip("option_price", ck.option_price)} ${esc(ck.option_price?.text || "")}</li>
        ${q5.options?.straddle_mid ? `<li>ATM straddle ${q5.options.dte}d @ ${fmt(q5.options.strike,1)}: ${fmt(q5.options.straddle_bid)} / ${fmt(q5.options.straddle_mid)} / ${fmt(q5.options.straddle_ask)} → priced move ${pct(q5.options.implied_move_horizon_pct,2,false)} over ${h}d</li>` : ""}
        ${isNum(q5.iv_rank) ? `<li>IV rank ${fmt(q5.iv_rank,0)} · IV − HV ${pct(q5.iv_hv_diff,1)}</li>` : ""}</ul></div>
      <div class="card deskq"><h3>6 · What would change my mind?</h3>
        <ul class="list">${isNum(q6.invalidation) ? `<li>Pipeline invalidation ${fmt(q6.invalidation)} (${distTo(q6.invalidation)} from close)</li>` : ""}
        ${isNum(q6.target) ? `<li>Pipeline target ${fmt(q6.target)} (${distTo(q6.target)} from close)</li>` : ""}
        ${trigList ? trigList.replace(/<li>/g, "<li>Money Index ") : ""}<li>A condition tile flipping state (Overview)</li></ul></div>
    </div>
    <div class="card" style="margin-top:10px"><h3>Evidence · next ${h} session(s)</h3>
      <table class="mini" style="width:100%"><thead><tr><th class="l">Evidence</th><th class="l">Lean</th><th>Mean</th><th>80% interval</th><th>Up</th><th>Windows</th></tr></thead><tbody>
        ${evRow("Macro: sessions like today", C.evidence?.macro)}
        ${evRow("Price only: all sessions", {lean: C.evidence?.macro?.baseline_lean, analog: C.evidence?.macro?.base, holdout: "NOT_APPLICABLE"})}
        ${evRow("Momentum: " + esc(MOM_TXT[e.momentum?.current?.streak] || ""), C.evidence?.momentum?.streak)}
        ${evRow("Momentum: 5d move " + esc(MOM_TXT[e.momentum?.current?.ext5] || ""), C.evidence?.momentum?.ext5)}
        ${evRow("Momentum: 20d move " + esc(MOM_TXT[e.momentum?.current?.ext20] || ""), C.evidence?.momentum?.ext20)}
      </tbody></table>
      <div class="note">${ckChip("macro_lean", ck.macro_lean)} ${esc(ck.macro_lean?.text || "")}<br>${ckChip("momentum", ck.momentum)} ${esc(ck.momentum?.text || "")}</div></div>
    <div class="card deskform" style="margin-top:10px"><h3>Your decision</h3>
      <div style="margin:6px 0 10px">${opt("ACT","Act")}${opt("WAIT","Wait")}${opt("SKIP","Skip")}${opt("INSUFFICIENT","Insufficient information")}</div>
      <label class="sub" for="dk-reason">Reason (one sentence; template below)</label>
      <textarea id="dk-reason" rows="4" placeholder="${esc(template)}">${esc(draft.reason || "")}</textarea>
      <label class="sub" for="dk-change">What would change my mind</label>
      <textarea id="dk-change" rows="2">${esc(draft.change || "")}</textarea>
      <label class="sub" for="dk-who">Trader</label><input type="text" id="dk-who" value="${esc(draft.who || "")}" placeholder="initials">
      <div class="controls"><button class="btn" id="dk-copy">Copy record</button><button class="btn" id="dk-save">Download record</button><button class="btn" id="dk-clear">Clear</button><span class="sub" id="dk-status">Drafts are kept in this browser until you clear them.</span></div>
      <div class="note">The record holds your decision with the facts the card showed (as of ${esc(B.as_of_session)}). Save it to <code>macro_board/output/journal/</code> so it can be scored later. The checks describe evidence; they never decide for you.</div></div>`;
  $("#dk-cand").onclick = ev => { const b = ev.target.closest("button[data-t]"); if (b) { state.deskTicker = b.dataset.t; state.deskH = null; renderDesk(); } };
  $("#dk-h").onclick = ev => { const b = ev.target.closest("button"); if (b) { state.deskH = b.dataset.h; renderDesk(); } };
  const collect = () => ({ decision: (document.querySelector("input[name=dk-decision]:checked") || {}).value || null,
    reason: $("#dk-reason").value, change: $("#dk-change").value, who: $("#dk-who").value });
  const persist = () => { try { localStorage.setItem(deskKey(t), JSON.stringify(collect())); } catch(err) {} };
  $("#p-desk .deskform").addEventListener("input", persist); $("#p-desk .deskform").addEventListener("change", persist);
  const record = () => JSON.stringify({ schema: "macro-board-desk-record-v1", board_version: B.board_version, as_of_session: B.as_of_session,
    recorded_at: new Date().toISOString(), ticker: t, horizon_sessions: Number(h), close: close, ...collect(),
    checks: Object.fromEntries(Object.entries(ck).map(([k, v]) => [k, v.status])),
    pipeline: { direction: P.canonical_direction, verdict: P.options_verdict, entry: P.entry_spot, target: P.target_spot, invalidation: P.invalidation_spot, run_id: B.pipeline?.run_id },
    evidence: { macro_lean: C.evidence?.macro?.lean, macro_mean_pct: C.evidence?.macro?.analog?.mean_pct, momentum_state: e.momentum?.current?.streak,
      momentum_mean_pct: C.evidence?.momentum?.streak?.analog?.mean_pct, priced_vs_history: q5.options?.priced_vs_history, iv_rank: q5.iv_rank } }, null, 2);
  $("#dk-copy").onclick = async () => { const text = record(); try { await navigator.clipboard.writeText(text); $("#dk-status").textContent = "Record copied."; }
    catch(err) { $("#dk-reason").select(); $("#dk-status").textContent = "Copy was blocked; use Download instead."; } };
  $("#dk-save").onclick = () => { const blob = new Blob([record()], {type: "application/json"}); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `desk_${t}_${B.as_of_session}.json`; document.body.appendChild(a); a.click(); a.remove();
    $("#dk-status").textContent = `Downloaded desk_${t}_${B.as_of_session}.json`; };
  $("#dk-clear").onclick = () => { try { localStorage.removeItem(deskKey(t)); } catch(err) {} renderDesk(); };
}

function renderAll(){
  renderReview(); renderOverview(); renderEtfs(); renderMap(); renderRotation(); renderDesk(); renderIntel(); renderScore(); renderMethod();
}
renderAll();
let start = "review"; try { start = localStorage.getItem("macroBoardPage") || start; } catch(e) {}
show(PAGES.some(p => p[0]===start) ? start : "review");
})();
</script>
</body>
</html>
