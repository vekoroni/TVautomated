<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF Macro Board</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb; --surface-2:#f4f3f0; --surface-3:#ebe9e4; --border:#dedcd6; --grid:#e8e6e1;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7873;
  --up:#2a78d6; --down:#e34948; --mid:#f0efec; --accent:#2a78d6;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#006300;
  --seq-1:#cde2fb; --seq-2:#86b6ef; --seq-3:#3987e5; --seq-4:#1c5cab;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --surface:#1a1a19; --surface-2:#222220; --surface-3:#2b2b29; --border:#3a3a37; --grid:#30302d;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
    --up:#3987e5; --down:#e66767; --mid:#383835; --accent:#3987e5; --good-text:#4cc84c;
    --seq-1:#184f95; --seq-2:#256abf; --seq-3:#5598e7; --seq-4:#9ec5f4;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19; --surface-2:#222220; --surface-3:#2b2b29; --border:#3a3a37; --grid:#30302d;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
  --up:#3987e5; --down:#e66767; --mid:#383835; --accent:#3987e5; --good-text:#4cc84c;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#5598e7; --seq-4:#9ec5f4;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:hidden}
a{color:var(--accent)}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-inner{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;font-size:16px;letter-spacing:.2px}
.brand small{font-weight:400;color:var(--text-2);margin-left:8px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.tabs button,.seg button,.btn{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);padding:5px 10px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.seg{display:inline-flex;gap:2px}
.authority{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:14px 0 10px}
.authority b{color:var(--text)}
h2{font-size:15px;margin:22px 0 10px;font-weight:650}
h3{font-size:13px;margin:0 0 8px;font-weight:650;color:var(--text)}
.sub{color:var(--text-2);font-size:12px}
.muted{color:var(--muted)}
.grid{display:grid;gap:10px}
.g-cond{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g-focus{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g-intel{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g-night{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--text-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.state{font-weight:650;font-size:15px;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--border);border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.chip.up{color:var(--up);border-color:color-mix(in oklab,var(--up) 45%,var(--border))}
.chip.down{color:var(--down);border-color:color-mix(in oklab,var(--down) 45%,var(--border))}
.chip.flat{color:var(--text-2)}
.chip.na{color:var(--muted);border-style:dashed}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.stat i{font-style:normal;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:10px;font-weight:700;color:#fff}
.stat.ok i{background:var(--good)} .stat.stale i{background:var(--warn);color:#000} .stat.miss i{background:var(--critical)}
.fresh-strip{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:6px 0 2px}
.pos{color:var(--up)} .neg{color:var(--down)}
.spark{display:block;width:100%;height:42px;margin-top:6px}
.strip{display:flex;height:8px;border-radius:3px;overflow:hidden;margin-top:4px;gap:0}
.strip span{flex:1 1 0;min-width:0}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:600;cursor:pointer;user-select:none;z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{z-index:3;background:var(--surface-2)}
td.l,th.l{text-align:left}
tr.grp td{background:var(--surface-3);color:var(--text-2);font-weight:650;text-align:left}
tbody tr.row:hover td{background:var(--surface-2);cursor:pointer}
tr.sel td{background:color-mix(in oklab,var(--accent) 10%,var(--surface))!important}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.controls input[type=search],.controls select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.heat{display:grid;gap:2px;font-size:11.5px}
.heat .cell{height:24px;border-radius:3px;display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--text);position:relative}
.heat .cell.weak{opacity:.38}
.heat .lab{display:flex;align-items:center;padding-right:6px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .colh{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--text-2);height:96px;display:flex;align-items:center;justify-content:flex-start}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin:6px 0}
.q-LEADING{--q:var(--up)} .q-LAGGING{--q:var(--down)} .q-WEAKENING{--q:#eb6834} .q-IMPROVING{--q:#1baf7a}
:root[data-theme="dark"] .q-WEAKENING{--q:#d95926} :root[data-theme="dark"] .q-IMPROVING{--q:#199e70}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--border);border-radius:8px;padding:4px 9px;background:var(--surface-2)}
.ck i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;background:var(--muted)}
.ck.good i{background:var(--good)} .ck.warn i{background:var(--warn);color:#000} .ck.bad i{background:var(--critical)}
.deskgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.deskq h3 small{font-weight:400;color:var(--text-2)}
.cand{display:flex;flex-wrap:wrap;gap:6px}
.cand button{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:4px 9px;border-radius:999px;cursor:pointer}
.cand button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
textarea,.deskform input[type=text]{font:inherit;font-size:13.5px;width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface);color:var(--text)}
.deskform label.opt{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:13.5px}
.qchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.qchip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--q)}
.legend .ramp{width:180px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--down),var(--mid),var(--up))}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:340px;display:none}
#tip b{color:var(--text)}
.bars{display:grid;grid-template-columns:minmax(110px,150px) 1fr 70px;gap:4px 8px;align-items:center;font-size:12px}
.bars .track{position:relative;height:14px;background:transparent}
.bars .track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--border)}
.bars .bar{position:absolute;top:2px;height:10px;border-radius:2px}
.list{margin:0;padding-left:18px;font-size:12.5px}
.list li{margin:2px 0}
details summary{cursor:pointer;color:var(--text-2);font-size:12.5px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:40;overflow:auto;padding:16px;transform:translateX(100%);transition:transform .18s ease;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.drawer .close{position:sticky;top:0;float:right}
.pill-row{display:flex;flex-wrap:wrap;gap:4px}
.page{display:none}.page.active{display:block}
.note{font-size:12px;color:var(--text-2);margin:6px 0 0}
.mini th,.mini td{padding:4px 6px;font-size:12px}
.mini th{position:static;cursor:default}
.mini th:first-child,.mini td:first-child{position:static}
.warnbox{border-left:3px solid var(--warn);padding:6px 10px;background:var(--surface-2);font-size:12.5px;margin:6px 0}
@media (max-width:640px){ header.top{position:static} .brand small{display:none} nav.tabs{margin-left:0} .big{font-size:22px} }
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand">ETF Macro Board <small id="hdr-asof"></small></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <button class="btn" id="theme" title="Toggle light/dark">◐</button>
</div></header>
<div class="wrap">
  <div class="authority" id="authority"></div>
  <div class="fresh-strip" id="fresh"></div>
  <section class="page" id="p-review"></section>
  <section class="page" id="p-overview"></section>
  <section class="page" id="p-etfs"></section>
  <section class="page" id="p-map"></section>
  <section class="page" id="p-rotation"></section>
  <section class="page" id="p-desk"></section>
  <section class="page" id="p-intel"></section>
  <section class="page" id="p-score"></section>
  <section class="page" id="p-method"></section>
</div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="tip" role="tooltip"></div>
<script>
const BOARD=/*__BOARD_PAYLOAD__*/null;
</script>
<script>
(function(){
"use strict";
const B = BOARD;
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const fmt = (v, d=2) => isNum(v) ? v.toFixed(d) : "—";
const pct = (v, d=2, sign=true) => isNum(v) ? (sign && v > 0 ? "+" : "") + v.toFixed(d) + "%" : "—";
const cls = v => isNum(v) ? (v > 0 ? "pos" : v < 0 ? "neg" : "") : "muted";
const words = s => esc(String(s ?? "—").replace(/_/g, " "));
const state = { horizon: String(B.horizons[B.horizons.length-1]), group: "ALL", q: "", freshOnly: true, sort: null, sortDir: -1, selected: null };
try { const s = JSON.parse(localStorage.getItem("macroBoardPrefs") || "{}"); Object.assign(state, s.horizon ? {horizon: s.horizon} : {}); } catch(e) {}
const savePrefs = () => { try { localStorage.setItem("macroBoardPrefs", JSON.stringify({horizon: state.horizon})); } catch(e) {} };

/* ---------- theme ---------- */
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};

/* ---------- tooltip ---------- */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

/* ---------- helpers ---------- */
const statusChip = (status, label) => {
  const s = String(status || "MISSING").toUpperCase();
  const k = s === "FRESH" || s === "OK" ? "ok" : s === "STALE" ? "stale" : "miss";
  const icon = k === "ok" ? "✓" : k === "stale" ? "!" : "×";
  return `<span class="stat ${k}"><i aria-hidden="true">${icon}</i>${esc(label ?? s)}</span>`;
};
const LEAN_TXT = {UP:"▲ Up", DOWN:"▼ Down", NO_CLEAR_LEAN:"– No clear lean", INSUFFICIENT_SAMPLE:"Insufficient sample", INSUFFICIENT_HISTORY:"Short history", PATH_DEPENDENT:"Path-dependent"};
const RESP_TXT = {SUPPORTING_RESPONSE:"Supporting", ABSORBING_PRESSURE:"Absorbing pressure", REJECTING_RELIEF:"Rejecting relief", MIXED:"Mixed", INSUFFICIENT:"Insufficient"};
const EXT_TXT = {EXTENDED_UP:"Extended ↑", EXTENDED_DOWN:"Extended ↓", NOT_EXTENDED:"Not extended", UNKNOWN:"—"};
const uncal = `<span class="chip na" title="A composite chosen by its author. It has not been calibrated against outcomes, so it is not a probability.">uncalibrated</span>`;
const ci = (s) => (s && isNum(s.ci_low_pct) && isNum(s.ci_high_pct)) ? `${pct(s.ci_low_pct,1)} … ${pct(s.ci_high_pct,1)}` : "—";
const respChip = (r) => { if (!r) return `<span class="chip na">—</span>`;
  const k = r.label === "SUPPORTING_RESPONSE" ? "" : r.label === "INSUFFICIENT" ? "na" : "flat";
  const tipTxt = `<b>${esc(RESP_TXT[r.label]||r.label)}</b><br>Measured headwinds active: ${esc((r.headwinds||[]).map(k=>condMeta[k]?.label||k).join(", ")||"none")}<br>Measured tailwinds active: ${esc((r.tailwinds||[]).map(k=>condMeta[k]?.label||k).join(", ")||"none")}<br>ETF's own return over the window: ${pct(r.own_return_pct)}<br><span class="muted">Describes behaviour only. It is not a permission or a probability.</span>`;
  return `<span class="chip ${k}" data-tip="${esc(tipTxt)}">${esc(RESP_TXT[r.label]||r.label)}</span>`; };
const extChip = (x) => { if (!x) return "—"; const k = x.state === "EXTENDED_UP" ? "up" : x.state === "EXTENDED_DOWN" ? "down" : "na";
  return `<span class="chip ${k}" title="Move over the window in units of the ETF's own realised volatility (z ${fmt(x.z)})">${EXT_TXT[x.state]||x.state} ${isNum(x.z)?fmt(x.z,1)+"σ":""}</span>`; };
const pipeChip = (p) => { if (!p) return `<span class="chip na">not in run</span>`;
  const d = p.canonical_direction, v = p.options_verdict;
  const k = d === "CALL" ? "up" : d === "PUT" ? "down" : "na";
  return `<span class="chip ${k}" data-tip="${esc(`<b>Pipeline ${esc(B.pipeline?.run_id||"")}</b><br>${esc(d)} · ${esc(v)}<br>${esc(p.stand_down_reason||"")}`)}">${esc(d||"—")} · ${words(v)}</span>`; };
const leanChip = (ev) => {
  if (!ev) return `<span class="chip na">n/a</span>`;
  const k = ev.lean === "UP" ? "up" : ev.lean === "DOWN" ? "down" : ev.lean === "NO_CLEAR_LEAN" ? "flat" : "na";
  return `<span class="chip ${k}" data-tip="${esc(leanTip(ev))}">${LEAN_TXT[ev.lean] || esc(ev.lean)}</span>`;
};
const HOLD_TXT = {HOLDOUT_AGREES:"✓ holdout", HOLDOUT_DISAGREES:"✗ holdout", HOLDOUT_THIN:"? holdout thin", NOT_APPLICABLE:""};
const holdChip = h => HOLD_TXT[h] ? `<span class="chip ${h==="HOLDOUT_AGREES"?"":"na"}" title="Held-out check from ${esc("last quarter of history")}">${HOLD_TXT[h]}</span>` : "";
function leanTip(ev){
  if (!ev || !ev.analog) return `<b>${esc(LEAN_TXT[ev?.lean] || ev?.lean)}</b><br>${esc(ev?.history_sessions ?? 0)} sessions of history (need ${B.settings.evidence.min_history_sessions}).`;
  const a = ev.analog || {}, b = ev.base || {}, t = ev.train || {}, h = ev.holdout_stats || {};
  return `<b>${esc(LEAN_TXT[ev.lean] || ev.lean)}</b> · ${esc((ev.holdout||"").replace(/_/g," ").toLowerCase())}<br>`+
    `Analog sessions: mean ${pct(a.mean_pct)}, median ${pct(a.median_pct)}, up ${fmt(100*(a.hit_rate??NaN),0)}% · n=${a.n}, independent windows ${a.n_eff}<br>`+
    `All history (base): mean ${pct(b.mean_pct)}, up ${fmt(100*(b.hit_rate??NaN),0)}%<br>`+
    `80% interval for the analog mean: ${ci(a)}<br>`+
    `Price-only lean (no macro): ${esc(LEAN_TXT[ev.baseline_lean]||ev.baseline_lean||"—")}<br>`+
    `Train (before ${esc(ev.holdout_from)}): mean ${pct(t.mean_pct)}, t ${fmt(t.t)} on ${t.n_eff} windows<br>`+
    `Holdout: mean ${pct(h.mean_pct)} on ${h.n_eff} windows<br><span class="muted">Return = next open → close ${state.horizon} session(s) later.</span>`;
}
function sparkSvg(values, opts={}){
  const v = (values || []).map(x => isNum(x) ? x : null);
  const pts = v.map((y,i) => [i,y]).filter(p => p[1] !== null);
  if (pts.length < 2) return `<div class="sub muted">no history</div>`;
  const W = 300, H = opts.h || 42, pad = 3;
  const ys = pts.map(p => p[1]); let lo = Math.min(...ys), hi = Math.max(...ys);
  if (opts.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = i => pad + (W - 2*pad) * i / Math.max(1, v.length - 1);
  const Y = y => H - pad - (H - 2*pad) * (y - lo) / (hi - lo);
  const d = pts.map((p,i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const last = pts[pts.length-1];
  const zero = opts.zero ? `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--border)" stroke-width="1"/>` : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.label||"history")}">${zero}`+
    `<path d="${d}" fill="none" stroke="${opts.color||"var(--seq-3)"}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`+
    `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3" fill="${opts.color||"var(--seq-3)"}" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function divergingColor(v, cap){
  if (!isNum(v)) return "var(--surface-3)";
  const share = Math.min(1, Math.abs(v) / cap);
  const pole = v >= 0 ? "var(--up)" : "var(--down)";
  return `color-mix(in oklab, ${pole} ${Math.round(share*85)}%, var(--mid))`;
}
const condMeta = Object.fromEntries(B.conditions.meta.map(m => [m.key, m]));
const VALUE_FMT = {
  market_trend: v => isNum(v) ? "SPY " + v.toFixed(2) : "—",
  market_vol: v => isNum(v) ? (100*v).toFixed(0) + "th pct" : "—",
  market_breadth: v => isNum(v) ? (100*v).toFixed(0) + "% above 50d" : "—",
  liquidity: v => isNum(v) ? "$" + (v/1000).toFixed(2) + "tn" : "—",
  curve_level: v => isNum(v) ? (v>0?"+":"") + (100*v).toFixed(0) + " bp" : "—",
  curve_move: v => isNum(v) ? (v>0?"+":"") + (100*v).toFixed(0) + " bp / 20d" : "—",
  yields: v => isNum(v) ? v.toFixed(2) + "%" : "—",
  credit: v => isNum(v) ? pct(v) + " / 20d" : "—",
  dollar: v => isNum(v) ? pct(v) + " / 20d" : "—",
  oil: v => isNum(v) ? pct(v) + " / 20d" : "—",
};

/* ---------- header / authority / freshness ---------- */

/* ---------- overnight (since the last US close) ---------- */
const NIGHT_GROUPS = [["us_futures","US index futures"],["us_premarket","US pre-market (ETFs)"],["volatility","VIX overnight"],
  ["fx","FX & dollar"],["rates_commodities","Rates & commodity futures"],["asia","Asia"],["europe","Europe"]];
const NIGHT_STATE = {OK:"", NO_TRADE_SINCE_CLOSE:"no trade since close", MISSING:"missing", MISSING_REFERENCE:"no close reference",
  CLOSED:"closed", INTRADAY:"in session", NOT_YET_OPEN:"not yet open", NO_SESSION_TODAY:"no session today"};
function renderOvernight(){
  const N = B.overnight || {status:"MISSING"};
  if (N.status === "MISSING" || N.status === "UNREADABLE")
    return `<h2>Overnight <span class="sub">since the last US close</span></h2>
      <div class="card"><div class="state" style="color:var(--critical)">× ${esc(N.status)}</div><div class="note">No overnight capture (dropbox/market_data/overnight_*.json). The market intelligence step of Run-MacroInputs writes it on every run; the pre-open run is the one that matters.</div></div>`;
  const night = (BK.kind === "MORNING" ? "" : ` <span class="chip na" title="Captured by a ${esc(N.run_session)} run: futures and FX have had little time to move since the close.">captured ${esc(N.run_session)}</span>`) +
    (N.us_reference_session && N.us_reference_session !== B.as_of_session ? ` <span class="chip" style="color:var(--serious)" title="The board's measured layers use daily bars to ${esc(B.as_of_session)}; the overnight capture measures from the ${esc(N.us_reference_session)} close.">! board prices end ${esc(B.as_of_session)}</span>` : "");
  const cards = NIGHT_GROUPS.filter(([k]) => (N.groups||{})[k]).map(([k, label]) => {
    const rows = N.groups[k], sm = (N.summary||{})[k] || {};
    const session = k === "asia" || k === "europe";
    const body = rows.map(r => {
      const st = NIGHT_STATE[r.state] ?? words(r.state);
      const age = isNum(r.age_minutes) ? (r.age_minutes >= 120 ? Math.round(r.age_minutes/60) + "h" : r.age_minutes + "m") : "—";
      const tipTxt = `<b>${esc(r.name)}</b> (${esc(r.symbol)}) · ${esc(r.source||"")}<br>`+
        (session ? `Session ${esc(r.session_date||"—")} vs ${esc(r.prev_session_date||"—")}: ${fmt(r.last)} vs ${fmt(r.prev_close)}` :
                   `Last ${fmt(r.last,4)} vs ${esc(r.reference_label||"reference")} ${fmt(r.reference,4)}`)+
        `<br>Last bar ${esc(r.last_bar_utc||"—")}${r.note ? "<br>" + esc(r.note) : ""}`;
      return `<tr data-tip="${esc(tipTxt)}"><td class="l">${esc(r.name)}</td><td class="${cls(r.change_pct)}">${pct(r.change_pct)}</td>`+
        `<td class="l ${r.state==="OK"||r.state==="CLOSED"?"muted":""}" style="${r.state&&r.state.startsWith("MISSING")?"color:var(--critical)":""}">${esc(st)}${r.after_break?' <span class="chip na">after break</span>':""}</td>`+
        `<td style="${r.stale?"color:var(--serious)":""}" class="${r.stale?"":"muted"}">${age}${r.stale?" !":""}</td></tr>`;
    }).join("");
    return `<div class="card"><h3>${esc(label)} <span class="sub">${sm.up ?? 0} up · ${sm.down ?? 0} down · median ${pct(sm.median_change_pct)}</span></h3>
      <table class="mini" style="width:100%"><tbody>${body}</tbody></table>
      <div class="note" style="font-size:11px">${session ? "move from its own previous close, in its own session" : "move since the US close"}</div></div>`;
  }).join("");
  const big = v => isNum(v) ? v.toLocaleString("en-US", {maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2}) : "—";
  const rel = (N.releases_today||[]).map(r => `<tr><td class="l">${esc(r.time_et)} ET</td><td class="l">${esc(r.name)}</td><td class="l ${r.state==="RELEASED"?"":"muted"}">${words(r.state)}</td>`+
    `<td>${big(r.value)}</td><td class="muted">${isNum(r.prior) ? "prior " + big(r.prior) : ""}</td></tr>`).join("")
    || `<tr><td class="l muted" colspan="5">No tracked 08:30 ET release scheduled today.</td></tr>`;
  const in7 = r => { const d = new Date(r.date + "T00:00:00Z"), a = new Date(String(N.as_of||"").slice(0,10) + "T00:00:00Z"); return isFinite(d) && isFinite(a) && (d - a) <= 7 * 864e5; };
  const ahead = (N.releases_ahead||[]).filter(in7).map(r => `<span class="chip">${esc(r.date.slice(5))} ${esc(r.name)}</span>`).join(" ");
  return `<h2>Overnight <span class="sub">since the US close ${esc(N.us_reference_session)} (${esc((N.us_reference_close_utc||"").replace("T"," ").replace("Z"," UTC"))}) · captured ${esc((N.as_of||"").replace("T"," ").replace("+00:00"," UTC"))}</span>
      <span data-tip="${esc(`Overnight capture · run ${esc(N.run_session)} · age ${N.age_hours ?? "—"} h<br>Reference: ${esc(N.us_reference_source)}<br>${(N.notes||[]).map(esc).join("<br>")}`)}">${statusChip(N.status, N.status === "FRESH" ? "fresh" : "stale capture")}</span>${night}</h2>
    <div class="grid g-night">${cards}
      <div class="card"><h3>US prints today <span class="sub">FRED</span></h3><table class="mini" style="width:100%"><tbody>${rel}</tbody></table>
        <div class="pill-row" style="margin-top:6px">${ahead ? '<span class="sub">Next 7 days:</span> ' + ahead : ""}</div>
        <div class="note" style="font-size:11px">Display only. Quotes are delayed (≈10–15 min); age shown, ! = older than ${esc(N.stale_after_minutes)} min.${(N.errors||[]).length ? " " + N.errors.length + " source error(s) in the capture." : ""}</div></div>
    </div>`;
}

/* ---------- CSV export (built in the browser from the board's own data) ---------- */
const csvCell = v => { const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function downloadCsv(name, cols, rows){
  const text = [cols.map(c => c[0]).join(",")].concat(rows.map(r => cols.map(c => csvCell(typeof c[1] === "function" ? c[1](r) : r[c[1]])).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + text], {type: "text/csv;charset=utf-8"}));
  a.download = `${name}_${B.as_of_session}_${(B.build?.kind || "build").toLowerCase()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
const csvBtn = (key, label) => `<button class="btn" data-csv="${key}" title="Download this table as CSV" style="float:right;padding:2px 8px;font-size:12px">${label || "CSV"}</button>`;

  reassess: () => downloadCsv("reassess_next_session", [["etf","etf"],["kind","kind"],["time_et","time_et"],["item","text"]],
    Object.entries(B.decision_points?.reassess||{}).flatMap(([etf, items]) => items.map(i => ({etf, ...i})))),
  unscheduled: () => downloadCsv("unscheduled_developments", [["development","name"],["importance","importance"],["confirms","confirms"],["fails","fails"],["source","source"],["as_of","as_of"]], (B.decision_points?.unscheduled?.items)||[]),
  leadership: () => { const L = B.opportunity?.leadership || {windows:{}}, br = L.breadth || {};
    downloadCsv("leadership_qqq_spy", [["window_sessions","h"],["qqq_pct","qqq_pct"],["spy_pct","spy_pct"],["qqq_minus_spy_pp","qqq_minus_spy_pp"],["leader","leader"],["breadth_state",()=>br.state],["rsp_minus_spy_20d_pp",()=>br.rsp_minus_spy_20d_pp],["spy_weight_above_50d_pct",()=>(br.participation_50d_pct||{}).SPY],["qqq_weight_above_50d_pct",()=>(br.participation_50d_pct||{}).QQQ]],
      Object.entries(L.windows).map(([h, w]) => ({h, ...w}))); },
  sectors: () => downloadCsv("sectors_vs_spy", [["etf","ticker"]].concat(B.horizons.flatMap(h => [[`ret_${h}d_pct`, r=>r.windows[h]?.absolute_pct],[`vs_spy_${h}d_pp`, r=>r.windows[h]?.relative_pp],[`reading_${h}d`, r=>r.windows[h]?.label],[`constituents_${h}d`, r=>r.windows[h]?.constituents],[`confirming_weight_${h}d_pct`, r=>r.windows[h]?.confirming_weight_pct],[`top_contributors_${h}d`, r=>(r.windows[h]?.top_contributors||[]).join(" ")]])), (B.opportunity?.sectors)||[]),
  room: () => downloadCsv("price_room", [["etf","t"],["close","close"],["daily_move_pct","daily_move_pct"],["above_level_name",r=>r.above?.name],["above_level",r=>r.above?.level],["above_distance_pct",r=>r.above?.distance_pct],["above_daily_moves",r=>r.above?.distance_daily_moves],["below_level_name",r=>r.below?.name],["below_level",r=>r.below?.level],["below_distance_pct",r=>r.below?.distance_pct],["below_daily_moves",r=>r.below?.distance_daily_moves],["gex_as_of","gex_as_of"]],
    Object.entries(B.opportunity?.room||{}).map(([t, r]) => ({t, ...r}))),
  reaction: () => downloadCsv("market_reaction", [["instrument","t"],["group","g"],["reading","label"],["direction","direction"],["path","path"],["gap_pct","gap_pct"],["open_to_close_pct","open_to_close_pct"],["close_pct","close_pct"],["daily_move_pct","daily_move_pct"],["threshold_pct","threshold_pct"]],
    Object.entries(B.review?.instruments||{}).map(([t, r]) => ({t, g: "cross-asset", ...r})).concat(Object.entries(B.review?.sectors||{}).map(([t, r]) => ({t, g: "sector", ...r})))),
  reaction_record: () => downloadCsv("reaction_record", [["etf","t"],["today","key"],["horizon_sessions","h"],["n_days","n"],["independent_windows","n_eff"],["mean_after_pct","mean"],["up_share","hit"],["ci_low_pct","lo"],["ci_high_pct","hi"],["all_days_mean_pct","base"],["lean","lean"],["holdout","holdout"]],
    Object.entries(B.review?.scored||{}).flatMap(([t, s]) => Object.entries(s.evidence||{}).map(([h, e]) => ({t, key: s.today?.key, h, n: e.analog?.n, n_eff: e.analog?.n_eff, mean: e.analog?.mean_pct, hit: e.analog?.hit_rate, lo: e.analog?.ci_low_pct, hi: e.analog?.ci_high_pct, base: e.base?.mean_pct, lean: e.lean, holdout: e.holdout})))),
  information: () => downloadCsv("information_review", [["event","name"],["institution","institution"],["status","status"],["what_changed","what_changed"],["expected","expected"],["previous","previous"],["revised_previous","revised_previous"],["surprise","surprise"],["source","source"],["source_url","source_url"]], (B.review?.information?.items)||[]),
  disagreements: () => downloadCsv("disagreements", [["instrument","ticker"],["close_pct","close_pct"],["reading","label"],["versus","versus"]], (B.review?.disagreements?.measured)||[]),
};
document.addEventListener("click", e => { const b = e.target.closest("[data-csv]"); if (b && CSV_EXPORTS[b.dataset.csv]) CSV_EXPORTS[b.dataset.csv](); });

/* ---------- daily review (section 1: the day's information and the market's reaction) ---------- */
const READ_TXT = {ACCEPTED:"accepted", REJECTED:"rejected", ABSORBED:"absorbed", UNKNOWN:"unknown"};
const PATH_TXT = {EXTENDED:"gap extended", FADED:"gap faded", NO_OPENING_REACTION:"no opening reaction"};
const KEY_TXT = {ACCEPTED_UP:"accepted up", ACCEPTED_DOWN:"accepted down", REJECTED_GAP_UP:"rejected a gap up", REJECTED_GAP_DOWN:"rejected a gap down", ABSORBED:"absorbed", UNKNOWN:"unknown"};
function readChip(r){ const l = r?.label || "UNKNOWN";
  const k = l === "ACCEPTED" ? (r.direction === "UP" ? "up" : "down") : l === "REJECTED" ? "flat" : "na";
  return `<span class="chip ${k}">${esc(READ_TXT[l]||l)}${l === "ACCEPTED" ? " " + (r.direction === "UP" ? "▲" : "▼") : l === "REJECTED" ? " gap " + (r.direction === "UP" ? "▲" : "▼") : ""}</span>`; }
function renderInformationReview(){
  const R = B.review;
  if (!R) return `<h2>The day's information and the market's reaction</h2><div class="card muted">Not in this build.</div>`;
  const row = (t, r) => `<tr><td class="l"><b>${esc(t)}</b></td><td class="l">${readChip(r)}</td><td class="${cls(r.gap_pct)}">${pct(r.gap_pct)}</td><td class="l muted">${esc(PATH_TXT[r.path]||"")}</td><td class="${cls(r.open_to_close_pct)}">${pct(r.open_to_close_pct)}</td><td class="${cls(r.close_pct)}"><b>${pct(r.close_pct)}</b></td><td class="muted">${isNum(r.daily_move_pct)?r.daily_move_pct.toFixed(2)+"%":"—"}</td></tr>`;
  const inst = Object.entries(R.instruments||{}).map(([t, r]) => row(t, r)).join("");
  const sect = Object.entries(R.sectors||{}).map(([t, r]) => row(t, r)).join("");
  const scored = Object.entries(R.scored||{}).map(([t, s]) => { const td = s.today || {};
    const cells = B.horizons.map(h => { const e = (s.evidence||{})[String(h)] || {}, a = e.analog || {}, b = e.base || {};
      return `<td class="${cls(a.mean_pct)}" data-tip="${esc(`After past ${KEY_TXT[td.key]||td.key} days: n=${a.n}, independent windows ${a.n_eff}, up ${isNum(a.hit_rate)?Math.round(a.hit_rate*100)+"%":"—"}, 80% interval ${ci(a)}<br>All days: ${pct(b.mean_pct)}<br>Lean ${e.lean||"—"} · ${e.holdout||""}`)}">${pct(a.mean_pct)} <span class="muted">vs ${pct(b.mean_pct)} · ${a.n_eff ?? 0} win.</span></td>`; }).join("");
    return `<tr><td class="l"><b>${esc(t)}</b></td><td class="l">${esc(KEY_TXT[td.key]||td.key||"")}</td>${cells}</tr>`; }).join("");
  const I = R.information || {}, D = R.disagreements || {}, U = R.unresolved || {};
  const payloadNote = I.payload_session ? (I.payload_matches_session ? `event payload for ${esc(I.payload_session)}` : `<span style="color:var(--serious)">event payload is for ${esc(I.payload_session)}, not ${esc(R.session)}</span>`) : `<span class="muted">no event payload</span>`;
  const irows = (I.items||[]).map(e => `<tr><td class="l"><b>${esc(e.name)}</b><div class="sub">${esc(e.institution||"")}</div></td><td class="l">${esc(e.what_changed||"")}</td><td class="l ${String(e.expected).startsWith("MISSING")?"muted":""}">${esc(e.expected||"")}</td><td class="l muted">${esc(e.previous||"")}${e.revised_previous ? "<br>revised: " + esc(e.revised_previous) : ""}</td><td class="l">${words(e.surprise||"")}</td><td class="l muted">${esc(e.source||"")}</td></tr>`).join("")
    || `<tr><td class="l muted" colspan="6">No new information in the inputs for this session.</td></tr>`;
  const drows = (D.measured||[]).map(d => `<li><b>${esc(d.ticker)}</b> <span class="${cls(d.close_pct)}">${pct(d.close_pct)}</span> ${esc(READ_TXT[d.label]||d.label)} · against ${esc(d.versus)}</li>`).join("") || `<li class="muted">No instrument moved beyond its threshold against SPY.</li>`;
  return `<h2>The day's information and the market's reaction <span class="sub">session ${esc(R.session)} · did the market accept the new information, reject it, or absorb it?</span></h2>
    <div class="card"><div class="state">${esc(R.headline || "")}</div>
      <div class="note">Measured on daily bars: the opening gap is the immediate response, the close against the previous close is the closing position, both in the instrument's own daily move (20 sessions before the day). Absorbed = the close moved less than ${esc(R.settings?.threshold_daily_moves)} of a daily move; rejected = a gap reversed through the previous close; accepted = otherwise. Provisional.</div></div>
    <div class="grid g-2" style="margin-top:10px">
      <div class="card"><h3>How did markets react? ${csvBtn("reaction")}</h3>
        <div class="table-wrap" style="max-height:440px"><table class="mini" style="width:100%"><thead><tr><th class="l">Instrument</th><th class="l">Reading</th><th>Gap</th><th class="l">Path</th><th>Open→close</th><th>Close</th><th>Daily move</th></tr></thead>
        <tbody>${inst}<tr><td class="l sub" colspan="7">Sectors</td></tr>${sect}</tbody></table></div></div>
      <div class="card"><h3>Has this reading meant anything before? ${csvBtn("reaction_record")}</h3>
        <table class="mini" style="width:100%"><thead><tr><th class="l">ETF</th><th class="l">Today</th>${B.horizons.map(h => `<th>Next ${h}d after similar days</th>`).join("")}</tr></thead><tbody>${scored}</tbody></table>
        <div class="note">Mean return from the next open to the close h sessions later after past sessions with the same reading, against all sessions; independent windows only. Hover for the interval and the held-out check.</div>
        <h3 style="margin-top:12px">What disagreed? ${csvBtn("disagreements")}</h3>
        <ul class="list">${drows}</ul>
        <div class="sub">SPY constituents: ${esc(D.constituents === "CONFIRMED" ? "moved with SPY" : D.constituents === "NOT_CONFIRMED" ? "did not confirm SPY's move" : "unknown")}${isNum(D.confirming_weight_1d_pct) ? " (" + Math.round(D.confirming_weight_1d_pct) + "% of weight moved the same way)" : ""}</div>
        ${(D.published||[]).length ? `<details style="margin-top:6px"><summary>Contradictions as published (event payload, ${(D.published||[]).length})</summary><ul class="list">${D.published.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}</div>
    </div>
    <div class="card" style="margin-top:10px"><h3>What changed, and what was expected? <span class="sub">${payloadNote} · consensus shown only where the source carries it</span> ${csvBtn("information")}</h3>
      <div class="table-wrap" style="max-height:420px"><table class="mini" style="width:100%"><thead><tr><th class="l">Development</th><th class="l">What changed</th><th class="l">Expected</th><th class="l">Previous</th><th class="l">Surprise</th><th class="l">Source</th></tr></thead><tbody>${irows}</tbody></table></div>
      <div class="note"><b>What remains unresolved:</b> ${esc(U.counter_case || "see the unscheduled developments under tomorrow's decision points")}${U.verdict ? " · verdict " + words(U.verdict) : ""}</div></div>`;
}

/* ---------- daily review (section 2: tomorrow's decision points) ---------- */
const KIND_LABEL = {RELEASE:"release", FOMC:"FOMC", EARNINGS:"earnings", HOLIDAY:"holiday", SHORTENED_SESSION:"short session", LEVEL:"level", UNSCHEDULED:"unscheduled"};
function renderDecisionPoints(){
  const D = B.decision_points;
  if (!D) return `<h2>Tomorrow's decision points</h2><div class="card muted">Not in this build.</div>`;
  const h = Number(state.horizon), cov = D.coverage || {};
  const kchip = k => `<span class="chip ${k==="FOMC"||k==="RELEASE"?"":k==="LEVEL"?"flat":k==="UNSCHEDULED"?"na":"up"}">${esc(KIND_LABEL[k]||k)}</span>`;
  const reassess = B.focus.map(t => { const items = (D.reassess||{})[t] || [];
    return `<div class="card soft"><h3>${esc(t)}</h3>${items.length ? `<ul class="list">${items.map(i => `<li>${kchip(i.kind)} ${esc(i.text)}</li>`).join("")}</ul>` : `<div class="sub muted">Nothing scheduled or nearby for the next session.</div>`}</div>`; }).join("");
  const cal = (D.calendar||[]).filter(e => e.sessions_ahead <= h);
  const crow = e => `<tr><td class="l num">${esc(e.date)}</td><td>${e.sessions_ahead}</td><td class="l">${kchip(e.kind)}</td><td class="l">${esc(e.name)}</td><td class="l">${esc(e.time_et||"")}</td>`+
    `<td class="l muted">${esc(e.detail||"")}${e.weights ? " · " + esc(Object.entries(e.weights).map(([k,v]) => k + " " + (isNum(v)?v.toFixed(1):v) + "%").join(", ")) : ""}</td><td class="l muted">${esc(e.source||"")}</td></tr>`;
  const U = D.unscheduled || {}, src = D.sources || {};
  const srcChip = x => x ? statusChip(x.status, (x.name||"").split(" (")[0] + (x.as_of ? " · " + String(x.as_of).slice(0,16).replace("T"," ") : "")) : "";
  const urows = (U.items||[]).map(g => `<tr><td class="l"><b>${esc(g.name)}</b></td><td class="l">${esc(g.importance||"")}</td><td class="l">${esc(g.confirms||"")}</td><td class="l">${esc(g.fails||"")}</td></tr>`).join("")
    || `<tr><td class="l muted" colspan="4">No unscheduled developments in the inputs.</td></tr>`;
  return `<h2>Tomorrow's decision points <span class="sub">next session ${esc(D.next_session)}${D.next_session_close_et && D.next_session_close_et !== "16:00" ? " · <b>closes " + esc(D.next_session_close_et) + " ET</b>" : ""} · scheduled events kept apart from unscheduled developments</span></h2>
    <div class="card"><h3>What could force participants to reassess these assets in the next session? ${csvBtn("reassess")}</h3>
      <div class="grid g-night">${reassess}</div>
      <div class="note">Next-session releases (ET), FOMC, holidays and shortened sessions, earnings of each ETF's own top holdings, price within ${esc(B.settings?.decision_points?.near_level_daily_moves ?? 1)} daily move of a level (section below), and high-importance unresolved developments.</div></div>
    <div class="card" style="margin-top:10px"><h3>Scheduled, known in advance <span class="sub">next ${h} session${h>1?"s":""} (horizon selector below)</span> ${csvBtn("decision_calendar")}</h3>
      <div class="table-wrap" style="max-height:420px"><table class="mini" style="width:100%"><thead><tr><th class="l">Date</th><th>Sessions ahead</th><th class="l">Kind</th><th class="l">Event</th><th class="l">Time ET</th><th class="l">Detail</th><th class="l">Source</th></tr></thead><tbody>${cal.map(crow).join("") || `<tr><td class="l muted" colspan="7">Nothing scheduled in this window.</td></tr>`}</tbody></table></div>
      <div class="note">Coverage: releases ${esc(cov.releases)} (FRED, overnight capture) · central-bank speakers from the event payload only · consensus: no free source · earnings ${esc(cov.earnings)}${(cov.earnings_unknown||[]).length ? ", date unknown for " + esc(cov.earnings_unknown.join(", ")) : ""}. FOMC dates from the Federal Reserve calendar (tentative until confirmed).</div></div>
    <div class="card" style="margin-top:10px"><h3>Unscheduled, unresolved developments <span class="sub">as published · LLM-made, not measured</span> ${csvBtn("unscheduled")}</h3>
      <div class="pill-row" style="margin-bottom:6px">${srcChip(src.enrichment)} ${srcChip(src.event_payload)}</div>
      <div class="table-wrap" style="max-height:320px"><table class="mini" style="width:100%"><thead><tr><th class="l">Development</th><th class="l">Importance</th><th class="l">Confirms if</th><th class="l">Fails if</th></tr></thead><tbody>${urows}</tbody></table></div>
      ${U.red_team ? `<div class="note"><b>Red-team question:</b> ${esc(U.red_team)}</div>` : ""}
      ${(U.counter_conditions||[]).length ? `<div class="note"><b>Would reverse or neutralise the case:</b> ${esc(U.counter_conditions.join(" · "))}</div>` : ""}
      ${U.verdict ? `<div class="note"><b>Event payload verdict:</b> ${words(U.verdict)}${U.verdict_scope ? " · " + esc(U.verdict_scope) : ""}</div>` : ""}</div>`;
}

/* ---------- daily review (section 3: where the opportunity is strongest) ---------- */
const REL_TXT = {OUTPERFORMING_AND_RISING:"Outperforming, rising", OUTPERFORMING_WHILE_FALLING:"Outperforming while falling",
  OUTPERFORMING_FLAT:"Outperforming, flat", UNDERPERFORMING_WHILE_RISING:"Lagging while rising", UNDERPERFORMING_AND_FALLING:"Lagging, falling",
  UNDERPERFORMING_FLAT:"Lagging, flat", IN_LINE:"In line with SPY", MISSING:"missing"};
const CONST_TXT = {CONFIRMED:"confirmed", NOT_CONFIRMED:"not confirmed", NO_HOLDINGS:"no holdings file", UNKNOWN:"—"};
const LEVEL_TXT = {high_252:"252d high", low_252:"252d low", sma50:"50d avg", sma200:"200d avg", call_wall:"GEX call wall",
  put_wall:"GEX put wall", gamma_flip:"GEX flip", pipeline_target:"pipeline target", pipeline_invalidation:"pipeline invalidation"};
function renderReview(){
  const O = B.opportunity;
  if (!O) { $("#p-review").innerHTML = `<h2>Daily review</h2><div class="card muted">Not in this build.</div>`; return; }
  const h = state.horizon, L = O.leadership, br = L.breadth || {};
  const lrows = B.horizons.map(hh => { const w = L.windows[String(hh)] || {};
    const k = w.leader === "QQQ" ? "up" : w.leader === "SPY" ? "flat" : "na";
    return `<tr><td class="l">${hh}d</td><td class="${cls(w.qqq_pct)}">${pct(w.qqq_pct)}</td><td class="${cls(w.spy_pct)}">${pct(w.spy_pct)}</td><td class="${cls(w.qqq_minus_spy_pp)}">${isNum(w.qqq_minus_spy_pp)?(w.qqq_minus_spy_pp>0?"+":"")+w.qqq_minus_spy_pp.toFixed(2)+" pp":"—"}</td><td class="l"><span class="chip ${k}">${esc(w.leader === "NEITHER" ? "neither" : w.leader === "MISSING" ? "missing" : w.leader + " leads")}</span></td></tr>`; }).join("");
  const bk = br.state === "BROAD" ? "" : br.state === "CONCENTRATED" ? "down" : "na";
  const part = br.participation_50d_pct || {};
  const sectors = (O.sectors || []).map(r => ({...r, w: (r.windows||{})[h] || {}}))
    .sort((a, b) => (isNum(b.w.relative_pp) ? b.w.relative_pp : -1e9) - (isNum(a.w.relative_pp) ? a.w.relative_pp : -1e9));
  const srows = sectors.map(r => { const w = r.w;
    const lk = (w.label||"").startsWith("OUTPERFORMING") ? (w.label === "OUTPERFORMING_WHILE_FALLING" ? "flat" : "up") : (w.label||"").startsWith("UNDERPERFORMING") ? "down" : "na";
    const note = w.label === "OUTPERFORMING_WHILE_FALLING" ? ` <span class="sub" title="Relative strength in a falling market: defensive preference, not a call setup">defensive</span>` : "";
    return `<tr><td class="l"><b>${esc(r.ticker)}</b></td><td class="${cls(w.absolute_pct)}">${pct(w.absolute_pct)}</td><td class="${cls(w.relative_pp)}">${isNum(w.relative_pp)?(w.relative_pp>0?"+":"")+w.relative_pp.toFixed(2)+" pp":"—"}</td>`+
      `<td class="l"><span class="chip ${lk}">${esc(REL_TXT[w.label]||w.label)}</span>${note}</td>`+
      `<td class="l ${w.constituents==="CONFIRMED"?"":"muted"}">${esc(CONST_TXT[w.constituents]||w.constituents)}${isNum(w.confirming_weight_pct)?" · "+Math.round(w.confirming_weight_pct)+"% of weight":""}</td>`+
      `<td class="l muted">${esc((w.top_contributors||[]).join(", "))}</td></tr>`; }).join("");
  const lvl = x => x ? `${esc(LEVEL_TXT[x.name]||x.name)} ${fmt(x.level)} <span class="${cls(x.distance_pct)}">${pct(x.distance_pct,1)}</span>${isNum(x.distance_daily_moves)?` <span class="muted">· ${x.distance_daily_moves.toFixed(1)} daily moves</span>`:""}` : `<span class="muted">none in range</span>`;
  const gexDate = r => r.gex_as_of && r.gex_as_of !== B.as_of_session ? ` <span class="chip na" title="GEX walls/flip are from the ${esc(r.gex_as_of)} session">GEX ${esc(r.gex_as_of)}</span>` : "";
  const rrows = Object.entries(O.room || {}).map(([t, r]) => `<tr><td class="l"><b>${esc(t)}</b>${gexDate(r)}</td><td>${fmt(r.close)}</td><td class="l">${lvl(r.above)}</td><td class="l">${lvl(r.below)}</td></tr>`).join("");
  $("#p-review").innerHTML = renderInformationReview() + `<div style="margin-top:22px"></div>` + renderDecisionPoints() + `<h2 style="margin-top:22px">Where the opportunity is strongest <span class="sub">market → sectors → constituents → price location · display only · thresholds provisional</span></h2>
    <div class="controls">${horizonSeg("hz-rev")}</div>
    <div class="grid g-2">
      <div class="card"><h3>Market: QQQ vs SPY ${csvBtn("leadership")}</h3>
        <table class="mini" style="width:100%"><thead><tr><th class="l">Window</th><th>QQQ</th><th>SPY</th><th>QQQ − SPY</th><th class="l">Leadership</th></tr></thead><tbody>${lrows}</tbody></table>
        <div style="margin-top:8px"><span class="chip ${bk}">${esc(br.state === "BROAD" ? "broad" : br.state === "CONCENTRATED" ? "concentrated" : "breadth unknown")}</span>
          <span class="sub">RSP − SPY (20d) ${isNum(br.rsp_minus_spy_20d_pp)?(br.rsp_minus_spy_20d_pp>0?"+":"")+br.rsp_minus_spy_20d_pp.toFixed(2)+" pp":"—"} · above 50d avg: SPY ${isNum(part.SPY)?Math.round(part.SPY)+"%":"—"}, QQQ ${isNum(part.QQQ)?Math.round(part.QQQ)+"%":"—"} of issuer weight</span></div>
        <div class="note">Broad needs equal-weight keeping pace and most index weight above its own 50-day average; either failing marks the move concentrated.</div></div>
      <div class="card"><h3>Price location <span class="sub">room to the nearest obstacle</span> ${csvBtn("room")}</h3>
        <div class="table-wrap" style="max-height:360px"><table class="mini" style="width:100%"><thead><tr><th class="l">ETF</th><th>Close</th><th class="l">Nearest above</th><th class="l">Nearest below</th></tr></thead><tbody>${rrows}</tbody></table></div>
        <div class="note">Levels: 252-session high/low where price traded (intraday), 50/200-session averages on closes, GEX walls and flip (SPY/QQQ, model estimate), pipeline target/invalidation. Daily move = 20-session realised volatility ÷ √252.</div></div>
    </div>
    <div class="card" style="margin-top:10px"><h3>Sectors vs SPY <span class="sub">${esc(h)}-session window · relative strength kept apart from direction</span> ${csvBtn("sectors")}</h3>
      <div class="table-wrap" style="max-height:none"><table class="mini" style="width:100%"><thead><tr><th class="l">ETF</th><th>Return</th><th>vs SPY</th><th class="l">Reading</th><th class="l">Constituents</th><th class="l">Top contributors</th></tr></thead><tbody>${srows}</tbody></table></div>
      <div class="note">"Outperforming while falling" (e.g. XLU down less than SPY) is defensive preference, not an attractive call. Constituents: confirmed when at least ${esc(O.settings?.confirmation_min_pct)}% of the ETF's priced issuer weight moved the same way over the window.</div></div>`;
  bindHorizon("hz-rev");
}

/* ---------- overview ---------- */
function renderOverview(){
  const C = B.conditions;
  const tiles = C.meta.map(m => {
    const st = C.current[m.key]; const v = C.current_values[m.key];
    const hist = C.history_states[m.key] || [];
    const idx = s => m.states.indexOf(s);
    const steps = ["var(--seq-1)","var(--seq-2)","var(--seq-3)","var(--seq-4)"];
    const strip = hist.map((s,i) => `<span style="background:${s==="MISSING" ? "var(--surface-3)" : steps[Math.min(3, Math.round(idx(s) * 3 / Math.max(1, m.states.length-1)))]}" data-tip="${esc(C.history_sessions[i])}: ${words(s)}"></span>`).join("");
    const legend = m.states.map((s,i) => `<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:${steps[Math.min(3, Math.round(i*3/Math.max(1,m.states.length-1)))]}"></span>${words(s)}</span>`).join(" ");
    const missing = st === "MISSING";
    const ob = (C.observations || {})[m.key] || {};
    const obTxt = ob.oldest ? `observed ${esc(ob.oldest)}${ob.sessions_old ? ` · ${ob.sessions_old} session${ob.sessions_old>1?"s":""} old` : ""}` : "no observation";
    const obTip = (ob.inputs||[]).map(i => `${esc(i.input)}: ${esc(i.observed||"missing")}`).join("<br>");
    return `<div class="card">
      <div class="sub" style="display:flex;justify-content:space-between;gap:6px"><span>${esc(m.label)}</span><span class="${ob.sessions_old ? "" : "muted"}" data-tip="${esc("<b>Observation dates used</b><br>" + obTip)}" style="${ob.sessions_old>=2?"color:var(--serious)":""}">${obTxt}</span></div>
      <div class="state" style="${missing?"color:var(--critical)":""}">${missing ? "× MISSING" : words(st)}</div>
      <div class="num sub">${VALUE_FMT[m.key] ? VALUE_FMT[m.key](v) : fmt(v)}</div>
      ${sparkSvg(C.history_values[m.key], {label: m.label, zero: ["curve_level","curve_move","credit","dollar","oil"].includes(m.key)})}
      <div class="strip" aria-label="state history">${strip}</div>
      <div class="note" style="font-size:11px;display:flex;flex-wrap:wrap;gap:4px 8px">${legend}</div>
      <div class="note" style="font-size:11px">${esc(m.measured)} · <span class="muted">${esc(m.source)}</span></div>
    </div>`;
  }).join("");
  const ch = C.changes.slice(0, 12).map(c => `<li><span class="num muted">${esc(c.session)}</span> · <b>${esc(condMeta[c.condition]?.label || c.condition)}</b>: ${words(c.from)} → <b>${words(c.to)}</b></li>`).join("") || `<li class="muted">No state changes in the last 10 sessions.</li>`;
  const A = B.analogs;
  const ladder = A.ladder.map(r => `<tr${r.level===A.match_level?' style="font-weight:650"':""}><td>${Math.round(r.level*100)}%</td><td>${r.sessions}</td><td>${r.n_eff}</td></tr>`).join("");
  const eps = A.episodes.map(e => `<tr><td>${esc(e.session)}</td>${B.focus.map(t => `<td class="${cls(e.forward[t])}">${pct(e.forward[t],1)}</td>`).join("")}</tr>`).join("");
  const focus = B.focus.map(t => focusCard(t)).join("");
  const p = B.intel.packet || {};
  $("#p-overview").innerHTML = renderOvernight() + `
    <h2>Index focus <span class="sub">measured lean per horizon · hover a chip for the evidence</span></h2>
    <div class="grid g-focus">${focus}</div>
    <h2>Macro conditions now <span class="sub">point-in-time, ${B.settings.conditions.change_sessions}-session changes scored against each series' trailing year</span></h2>
    <div class="grid g-cond">${tiles}</div>
    <div class="grid g-2" style="margin-top:10px">
      <div class="card"><h3>What changed (last 10 sessions)</h3><ul class="list">${ch}</ul></div>
      <div class="card"><h3>Analog depth</h3>
        <div class="sub">Today has ${A.dimensions} observed conditions. The board uses the closest match level that still holds ≥ ${B.settings.evidence.analog_target_effective_n} independent ${Math.max(...B.horizons)}-session windows.</div>
        <div class="big" style="margin:6px 0">${Math.round(A.match_level*100)}% <span class="sub">match · ${A.count} sessions</span></div>
        <table class="mini"><thead><tr><th class="l">Match level</th><th>Sessions</th><th>Independent windows</th></tr></thead><tbody>${ladder}</tbody></table>
      </div>

        <div class="table-wrap" style="max-height:none;border:none"><table class="mini"><thead><tr><th class="l">Episode</th>${B.focus.map(t=>`<th>${t}</th>`).join("")}</tr></thead><tbody>${eps}</tbody></table></div>

        <div class="state">${words(p.regime_label)}</div>
        <div class="sub">${words(p.risk_on_off_switch)} · conviction ${fmt(p.macro_conviction)} · probability ${fmt(p.regime_probability)}</div>

}
function focusCard(t){
  const e = B.etfs[t]; if (!e) return "";

  const ev = e.evidence || {};
  const rows = B.horizons.map(h => {

    const a = x?.analog || {}, b = x?.base || {};
    return `<tr><td>${h}d</td><td class="l">${leanChip(x)} ${holdChip(x?.holdout)}</td><td class="${cls(a.mean_pct)}">${pct(a.mean_pct)}</td><td class="muted">${ci(a)}</td><td class="${cls(b.mean_pct)}">${pct(b.mean_pct)}</td><td>${a.n_eff ?? "—"}</td></tr>`;
  }).join("");
  const o = e.options, dcs = e.decision || {};
  const optRows = o ? B.horizons.map(h => { const mv = (o.moves||{})[String(h)];

  const optBlock = o ? `<table class="mini" style="margin-top:6px;width:100%"><thead><tr><th class="l">H</th><th>Expiry · ATM</th><th>Priced move</th><th>Analog |move|</th><th>Ratio</th><th>Spread</th></tr></thead><tbody>${optRows}</tbody></table>
    <div class="note">ATM straddle from executable chain quotes ${esc(o.quote_date)} ${o.status!=="FRESH"?statusChip(o.status, o.sessions_old+" sessions old"):""}, scaled to the horizon. A ratio above 1 means options price more movement than similar past sessions delivered.</div>` : `<div class="note muted">No option chain in the store for ${t}.</div>`;
  const resp = (dcs.response||{})[state.horizon];
  const ext20 = (dcs.extension||{})["20"], ext5 = (dcs.extension||{})["5"];
  const g = (B.intel.gex || []).find(r => r.Ticker === t);
  const gex = g ? `<div class="sub" style="margin-top:6px" data-tip="${esc(`Model estimate (${esc(g.Greek_Model_Disclosure)}). Dealer short-call/long-put sign is assumed. The Money Index reports authoritative dealer inventory as unavailable.`)}">Dealer gamma <span class="chip na">model estimate · sign assumed</span> <b>${words(g.Regime)}</b> · net ${fmt(g.Net_GEX_Bn)}bn · flip ${fmt(g.Gamma_Flip,1)} · call wall ${fmt(g.Call_Wall,0)} · put wall ${fmt(g.Put_Wall,0)} <span class="muted">(${esc(g.Date)})</span></div>` : "";
  const stale = m.status !== "FRESH" ? `<div class="warnbox">${statusChip(m.status)} last bar ${esc(m.last_session)}</div>` : "";
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <div><span class="state">${t}</span> <span class="sub">${esc(groupOf(t))}</span></div>
      <div class="big">${fmt(m.close)}</div></div>
    <div class="sub num">1d <span class="${cls(m.ret_1d)}">${pct(m.ret_1d)}</span> · 5d <span class="${cls(m.ret_5d)}">${pct(m.ret_5d)}</span> · 20d <span class="${cls(m.ret_20d)}">${pct(m.ret_20d)}</span> · vs 200d <span class="${cls(m.vs_sma200)}">${pct(m.vs_sma200,1)}</span> · RV20 ${fmt(m.rv20,1)}%</div>
    ${stale}
    ${sparkSvg(m.spark, {label: t + " closes", color: "var(--text-2)"})}
    <div class="pill-row" style="margin-top:6px"><span class="sub">Pipeline</span> ${pipeChip(e.pipeline)}${e.pipeline?.remaining && isNum(e.pipeline.remaining.target_consumed) ? ` <span class="chip ${e.pipeline.remaining.target_consumed >= 0.5 ? "flat" : "na"}" title="Share of the pipeline's entry→target move already made at today's close">${Math.round(100*e.pipeline.remaining.target_consumed)}% of target used</span>` : ""} <span class="sub">· Response ${state.horizon}d</span> ${respChip(resp)} <span class="sub">· Move made 5d</span> ${extChip(ext5)} <span class="sub">20d</span> ${extChip(ext20)}</div>
    <table class="mini" style="margin-top:6px;width:100%"><thead><tr><th class="l">H</th><th class="l">Measured lean</th><th>Analog</th><th>80% interval</th><th>Base</th><th>Win.</th></tr></thead><tbody>${rows}</tbody></table>
    ${optBlock}
    ${e.tastytrade ? `<div class="sub num" style="margin-top:6px" data-tip="${esc("IV-based expected |move| = IV × √(h/252) × √(2/π). Compare with the straddle-priced move above.")}">tastytrade IV ${fmt(e.tastytrade.iv_index_pct,1)}% · IV rank ${fmt(e.tastytrade.iv_rank_pct,0)} · HV30 ${fmt(e.tastytrade.hv30_pct,1)}% · IV−HV ${pct(e.tastytrade.iv_hv_diff_pct,1)} · IV-implied |move| ${state.horizon}d ${pct((e.tastytrade.iv_expected_abs_move_pct||{})[state.horizon],2,false)}</div>` : ""}
    ${e.holdings ? `<div style="margin-top:6px">${holdBlock(t, true)}</div>` : ""}
    ${gex}
  </div>`;
}
function ttBlock(t){
  const m = (B.etfs[t] || {}).tastytrade; const T = B.tastytrade || {};

  const all = tickers.flatMap(t => keys.map(k => Math.abs(B.etfs[t].sensitivity[h][k]?.excess_pct || 0)));
  const sorted = all.filter(isNum).sort((a,b)=>a-b);
  const cap = Math.max(0.2, sorted[Math.floor(sorted.length*0.95)] || 1);
  const cols = `minmax(64px,90px) repeat(${keys.length}, minmax(44px,1fr))`;
  let html = `<div class="heat" style="grid-template-columns:${cols}"><div></div>` + keys.map(k => `<div class="colh" title="${esc(condMeta[k].measured)}">${esc(condMeta[k].label)}: ${words(B.conditions.current[k])}</div>`).join("");
  let lastG = null;
  tickers.forEach(t => {
    if (groupOf(t) !== lastG){ lastG = groupOf(t); html += `<div class="lab" style="grid-column:1/-1;color:var(--text);font-weight:650;margin-top:6px">${esc(lastG)}</div>`; }
    html += `<div class="lab"><b>${t}</b></div>` + keys.map(k => { const s = B.etfs[t].sensitivity[h][k] || {}; const v = s.excess_pct;
      const weak = !isNum(s.t) || Math.abs(s.t) < 1;
      return `<div class="cell ${weak?"weak":""}" style="background:${divergingColor(v, cap)}" data-tip="${esc(`<b>${t} · ${esc(condMeta[k].label)} = ${words(s.state)}</b><br>Excess ${h}d return in this state: ${pct(v)}<br>t ${fmt(s.t)} · ${s.n_eff_in ?? 0} independent windows in state<br>Mean while in state ${pct(s.mean_in_pct)}`)}">${isNum(v) ? (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1)) : "×"}</div>`; }).join("");
  });
  html += `</div>`;
  $("#p-map").innerHTML = `<h2>Transmission map <span class="sub">how each ETF's forward return differed while each condition sat in today's state</span></h2>
    <div class="controls">${horizonSeg("hz-map")}
    <div class="legend"><span>${pct(-cap,1)}</span><span class="ramp"></span><span>${pct(cap,1)}</span><span>· faded = |t| &lt; 1 (weak) · × = condition missing</span></div></div>
    <div class="card" style="overflow:auto">${html}</div>
    <div class="note">Cell = mean ${h}-session return (next open → close) while the condition was in today's state, minus its mean in the condition's other observed states. Blue means the ETF did better, red worse. These are single-condition contrasts on overlapping windows, so use them to see where macro has been transmitting, not as stand-alone signals. Colour scale capped at the 95th percentile.</div>`;
  bindHorizon("hz-map");
}

/* ---------- scorecards ---------- */
function scoreTable(results){
  const tick = Object.keys(results || {});
  if (!tick.length) return `<div class="sub muted">No scorable calls.</div>`;
  return `<table class="mini" style="width:100%"><thead><tr><th class="l">ETF</th>${B.horizons.map(h=>`<th>${h}d hit</th><th>${h}d signed</th><th>${h}d win.</th>`).join("")}</tr></thead><tbody>${tick.map(t => `<tr><td class="l"><b>${t}</b></td>${B.horizons.map(h => { const r = results[t][String(h)] || {};
    const thin = (r.n_eff||0) < B.settings.evidence.min_effective_n;
    return `<td class="${thin?"muted":""}">${isNum(r.hit_rate)?Math.round(100*r.hit_rate)+"%":"—"}</td><td class="${cls(r.mean_signed_pct)}">${pct(r.mean_signed_pct)}</td><td class="${thin?"muted":""}">${r.n_eff ?? 0}${thin?" ?":""}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
}
