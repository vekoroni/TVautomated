<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF Macro Board</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb; --surface-2:#f4f3f0; --surface-3:#ebe9e4; --border:#dedcd6; --grid:#e8e6e1;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7873;
  --up:#2a78d6; --down:#e34948; --mid:#f0efec; --accent:#2a78d6;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#006300;
  --seq-1:#cde2fb; --seq-2:#86b6ef; --seq-3:#3987e5; --seq-4:#1c5cab;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --surface:#1a1a19; --surface-2:#222220; --surface-3:#2b2b29; --border:#3a3a37; --grid:#30302d;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
    --up:#3987e5; --down:#e66767; --mid:#383835; --accent:#3987e5; --good-text:#4cc84c;
    --seq-1:#184f95; --seq-2:#256abf; --seq-3:#5598e7; --seq-4:#9ec5f4;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19; --surface-2:#222220; --surface-3:#2b2b29; --border:#3a3a37; --grid:#30302d;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
  --up:#3987e5; --down:#e66767; --mid:#383835; --accent:#3987e5; --good-text:#4cc84c;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#5598e7; --seq-4:#9ec5f4;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:hidden}
a{color:var(--accent)}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-inner{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;font-size:16px;letter-spacing:.2px}
.brand small{font-weight:400;color:var(--text-2);margin-left:8px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.tabs button,.seg button,.btn{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);padding:5px 10px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.seg{display:inline-flex;gap:2px}
.authority{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:14px 0 10px}
.authority b{color:var(--text)}
h2{font-size:15px;margin:22px 0 10px;font-weight:650}
h3{font-size:13px;margin:0 0 8px;font-weight:650;color:var(--text)}
.sub{color:var(--text-2);font-size:12px}
.muted{color:var(--muted)}
.grid{display:grid;gap:10px}
.g-cond{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g-focus{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g-intel{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--text-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.state{font-weight:650;font-size:15px;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--border);border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.chip.up{color:var(--up);border-color:color-mix(in oklab,var(--up) 45%,var(--border))}
.chip.down{color:var(--down);border-color:color-mix(in oklab,var(--down) 45%,var(--border))}
.chip.flat{color:var(--text-2)}
.chip.na{color:var(--muted);border-style:dashed}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.stat i{font-style:normal;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:10px;font-weight:700;color:#fff}
.stat.ok i{background:var(--good)} .stat.stale i{background:var(--warn);color:#000} .stat.miss i{background:var(--critical)}
.fresh-strip{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:6px 0 2px}
.pos{color:var(--up)} .neg{color:var(--down)}
.spark{display:block;width:100%;height:42px;margin-top:6px}
.strip{display:flex;height:8px;border-radius:3px;overflow:hidden;margin-top:4px;gap:0}
.strip span{flex:1 1 0;min-width:0}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:600;cursor:pointer;user-select:none;z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{z-index:3;background:var(--surface-2)}
td.l,th.l{text-align:left}
tr.grp td{background:var(--surface-3);color:var(--text-2);font-weight:650;text-align:left}
tbody tr.row:hover td{background:var(--surface-2);cursor:pointer}
tr.sel td{background:color-mix(in oklab,var(--accent) 10%,var(--surface))!important}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.controls input[type=search],.controls select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.heat{display:grid;gap:2px;font-size:11.5px}
.heat .cell{height:24px;border-radius:3px;display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--text);position:relative}
.heat .cell.weak{opacity:.38}
.heat .lab{display:flex;align-items:center;padding-right:6px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .colh{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--text-2);height:96px;display:flex;align-items:center;justify-content:flex-start}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin:6px 0}
.q-LEADING{--q:var(--up)} .q-LAGGING{--q:var(--down)} .q-WEAKENING{--q:#eb6834} .q-IMPROVING{--q:#1baf7a}
:root[data-theme="dark"] .q-WEAKENING{--q:#d95926} :root[data-theme="dark"] .q-IMPROVING{--q:#199e70}
.qchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.qchip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--q)}
.legend .ramp{width:180px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--down),var(--mid),var(--up))}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:340px;display:none}
#tip b{color:var(--text)}
.bars{display:grid;grid-template-columns:minmax(110px,150px) 1fr 70px;gap:4px 8px;align-items:center;font-size:12px}
.bars .track{position:relative;height:14px;background:transparent}
.bars .track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--border)}
.bars .bar{position:absolute;top:2px;height:10px;border-radius:2px}
.list{margin:0;padding-left:18px;font-size:12.5px}
.list li{margin:2px 0}
details summary{cursor:pointer;color:var(--text-2);font-size:12.5px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:40;overflow:auto;padding:16px;transform:translateX(100%);transition:transform .18s ease;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.drawer .close{position:sticky;top:0;float:right}
.pill-row{display:flex;flex-wrap:wrap;gap:4px}
.page{display:none}.page.active{display:block}
.note{font-size:12px;color:var(--text-2);margin:6px 0 0}
.mini th,.mini td{padding:4px 6px;font-size:12px}
.mini th{position:static;cursor:default}
.mini th:first-child,.mini td:first-child{position:static}
.warnbox{border-left:3px solid var(--warn);padding:6px 10px;background:var(--surface-2);font-size:12.5px;margin:6px 0}
@media (max-width:640px){ header.top{position:static} .brand small{display:none} nav.tabs{margin-left:0} .big{font-size:22px} }
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand">ETF Macro Board <small id="hdr-asof"></small></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <button class="btn" id="theme" title="Toggle light/dark">◐</button>
</div></header>
<div class="wrap">
  <div class="authority" id="authority"></div>
  <div class="fresh-strip" id="fresh"></div>
  <section class="page" id="p-overview"></section>
  <section class="page" id="p-etfs"></section>
  <section class="page" id="p-map"></section>
  <section class="page" id="p-rotation"></section>
  <section class="page" id="p-intel"></section>
  <section class="page" id="p-score"></section>
  <section class="page" id="p-method"></section>
</div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="tip" role="tooltip"></div>
<script>
const BOARD=/*__BOARD_PAYLOAD__*/null;
</script>
<script>
(function(){
"use strict";
const B = BOARD;
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const fmt = (v, d=2) => isNum(v) ? v.toFixed(d) : "—";
const pct = (v, d=2, sign=true) => isNum(v) ? (sign && v > 0 ? "+" : "") + v.toFixed(d) + "%" : "—";
const cls = v => isNum(v) ? (v > 0 ? "pos" : v < 0 ? "neg" : "") : "muted";
const words = s => esc(String(s ?? "—").replace(/_/g, " "));
const state = { horizon: String(B.horizons[B.horizons.length-1]), group: "ALL", q: "", freshOnly: true, sort: null, sortDir: -1, selected: null };
try { const s = JSON.parse(localStorage.getItem("macroBoardPrefs") || "{}"); Object.assign(state, s.horizon ? {horizon: s.horizon} : {}); } catch(e) {}
const savePrefs = () => { try { localStorage.setItem("macroBoardPrefs", JSON.stringify({horizon: state.horizon})); } catch(e) {} };

/* ---------- theme ---------- */
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};

/* ---------- tooltip ---------- */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

/* ---------- helpers ---------- */
const statusChip = (status, label) => {
  const s = String(status || "MISSING").toUpperCase();
  const k = s === "FRESH" || s === "OK" ? "ok" : s === "STALE" ? "stale" : "miss";
  const icon = k === "ok" ? "✓" : k === "stale" ? "!" : "×";
  return `<span class="stat ${k}"><i aria-hidden="true">${icon}</i>${esc(label ?? s)}</span>`;
};
const LEAN_TXT = {UP:"▲ Up", DOWN:"▼ Down", NO_CLEAR_LEAN:"– No clear lean", INSUFFICIENT_SAMPLE:"Insufficient sample", INSUFFICIENT_HISTORY:"Short history", PATH_DEPENDENT:"Path-dependent"};
const RESP_TXT = {SUPPORTING_RESPONSE:"Supporting", ABSORBING_PRESSURE:"Absorbing pressure", REJECTING_RELIEF:"Rejecting relief", MIXED:"Mixed", INSUFFICIENT:"Insufficient"};
const EXT_TXT = {EXTENDED_UP:"Extended ↑", EXTENDED_DOWN:"Extended ↓", NOT_EXTENDED:"Not extended", UNKNOWN:"—"};
const uncal = `<span class="chip na" title="A composite chosen by its author. It has not been calibrated against outcomes, so it is not a probability.">uncalibrated</span>`;
const ci = (s) => (s && isNum(s.ci_low_pct) && isNum(s.ci_high_pct)) ? `${pct(s.ci_low_pct,1)} … ${pct(s.ci_high_pct,1)}` : "—";
const respChip = (r) => { if (!r) return `<span class="chip na">—</span>`;
  const k = r.label === "SUPPORTING_RESPONSE" ? "" : r.label === "INSUFFICIENT" ? "na" : "flat";
  const tipTxt = `<b>${esc(RESP_TXT[r.label]||r.label)}</b><br>Measured headwinds active: ${esc((r.headwinds||[]).map(k=>condMeta[k]?.label||k).join(", ")||"none")}<br>Measured tailwinds active: ${esc((r.tailwinds||[]).map(k=>condMeta[k]?.label||k).join(", ")||"none")}<br>ETF's own return over the window: ${pct(r.own_return_pct)}<br><span class="muted">Describes behaviour only. It is not a permission or a probability.</span>`;
  return `<span class="chip ${k}" data-tip="${esc(tipTxt)}">${esc(RESP_TXT[r.label]||r.label)}</span>`; };
const extChip = (x) => { if (!x) return "—"; const k = x.state === "EXTENDED_UP" ? "up" : x.state === "EXTENDED_DOWN" ? "down" : "na";
  return `<span class="chip ${k}" title="Move over the window in units of the ETF's own realised volatility (z ${fmt(x.z)})">${EXT_TXT[x.state]||x.state} ${isNum(x.z)?fmt(x.z,1)+"σ":""}</span>`; };
const pipeChip = (p) => { if (!p) return `<span class="chip na">not in run</span>`;
  const d = p.canonical_direction, v = p.options_verdict;
  const k = d === "CALL" ? "up" : d === "PUT" ? "down" : "na";
  return `<span class="chip ${k}" data-tip="${esc(`<b>Pipeline ${esc(B.pipeline?.run_id||"")}</b><br>${esc(d)} · ${esc(v)}<br>${esc(p.stand_down_reason||"")}`)}">${esc(d||"—")} · ${words(v)}</span>`; };
const leanChip = (ev) => {
  if (!ev) return `<span class="chip na">n/a</span>`;
  const k = ev.lean === "UP" ? "up" : ev.lean === "DOWN" ? "down" : ev.lean === "NO_CLEAR_LEAN" ? "flat" : "na";
  return `<span class="chip ${k}" data-tip="${esc(leanTip(ev))}">${LEAN_TXT[ev.lean] || esc(ev.lean)}</span>`;
};
const HOLD_TXT = {HOLDOUT_AGREES:"✓ holdout", HOLDOUT_DISAGREES:"✗ holdout", HOLDOUT_THIN:"? holdout thin", NOT_APPLICABLE:""};
const holdChip = h => HOLD_TXT[h] ? `<span class="chip ${h==="HOLDOUT_AGREES"?"":"na"}" title="Held-out check from ${esc("last quarter of history")}">${HOLD_TXT[h]}</span>` : "";
function leanTip(ev){
  if (!ev || !ev.analog) return `<b>${esc(LEAN_TXT[ev?.lean] || ev?.lean)}</b><br>${esc(ev?.history_sessions ?? 0)} sessions of history (need ${B.settings.evidence.min_history_sessions}).`;
  const a = ev.analog, b = ev.base, t = ev.train, h = ev.holdout_stats;
  return `<b>${esc(LEAN_TXT[ev.lean] || ev.lean)}</b> · ${esc((ev.holdout||"").replace(/_/g," ").toLowerCase())}<br>`+
    `Analog sessions: mean ${pct(a.mean_pct)}, median ${pct(a.median_pct)}, up ${fmt(100*(a.hit_rate??NaN),0)}% · n=${a.n}, independent windows ${a.n_eff}<br>`+
    `All history (base): mean ${pct(b.mean_pct)}, up ${fmt(100*(b.hit_rate??NaN),0)}%<br>`+
    `80% interval for the analog mean: ${ci(a)}<br>`+
    `Price-only lean (no macro): ${esc(LEAN_TXT[ev.baseline_lean]||ev.baseline_lean||"—")}<br>`+
    `Train (before ${esc(ev.holdout_from)}): mean ${pct(t.mean_pct)}, t ${fmt(t.t)} on ${t.n_eff} windows<br>`+
    `Holdout: mean ${pct(h.mean_pct)} on ${h.n_eff} windows<br><span class="muted">Return = next open → close ${state.horizon} session(s) later.</span>`;
}
function sparkSvg(values, opts={}){
  const v = (values || []).map(x => isNum(x) ? x : null);
  const pts = v.map((y,i) => [i,y]).filter(p => p[1] !== null);
  if (pts.length < 2) return `<div class="sub muted">no history</div>`;
  const W = 300, H = opts.h || 42, pad = 3;
  const ys = pts.map(p => p[1]); let lo = Math.min(...ys), hi = Math.max(...ys);
  if (opts.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = i => pad + (W - 2*pad) * i / Math.max(1, v.length - 1);
  const Y = y => H - pad - (H - 2*pad) * (y - lo) / (hi - lo);
  const d = pts.map((p,i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const last = pts[pts.length-1];
  const zero = opts.zero ? `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--border)" stroke-width="1"/>` : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.label||"history")}">${zero}`+
    `<path d="${d}" fill="none" stroke="${opts.color||"var(--seq-3)"}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`+
    `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3" fill="${opts.color||"var(--seq-3)"}" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function divergingColor(v, cap){
  if (!isNum(v)) return "var(--surface-3)";
  const share = Math.min(1, Math.abs(v) / cap);
  const pole = v >= 0 ? "var(--up)" : "var(--down)";
  return `color-mix(in oklab, ${pole} ${Math.round(share*85)}%, var(--mid))`;
}
const condMeta = Object.fromEntries(B.conditions.meta.map(m => [m.key, m]));
const VALUE_FMT = {
  market_trend: v => isNum(v) ? "SPY " + v.toFixed(2) : "—",
  market_vol: v => isNum(v) ? (100*v).toFixed(0) + "th pct" : "—",
  market_breadth: v => isNum(v) ? (100*v).toFixed(0) + "% above 50d" : "—",
  liquidity: v => isNum(v) ? "$" + (v/1000).toFixed(2) + "tn" : "—",
  curve_level: v => isNum(v) ? (v>0?"+":"") + (100*v).toFixed(0) + " bp" : "—",
  curve_move: v => isNum(v) ? (v>0?"+":"") + (100*v).toFixed(0) + " bp / 20d" : "—",
  yields: v => isNum(v) ? v.toFixed(2) + "%" : "—",
  credit: v => isNum(v) ? pct(v) + " / 20d" : "—",
  dollar: v => isNum(v) ? pct(v) + " / 20d" : "—",
  oil: v => isNum(v) ? pct(v) + " / 20d" : "—",
};

/* ---------- header / authority / freshness ---------- */
$("#hdr-asof").textContent = `as of ${B.as_of_session} close · built ${B.built_at_utc.replace("T"," ").replace("+00:00"," UTC")}`;
$("#authority").innerHTML = `<b>Standalone decision board.</b> Reads AVSHUNTER data read-only and feeds nothing back into the pipeline. `+
  `<b>Measured leans</b> are what each ETF did after past sessions whose macro conditions resembled today (next open → close, independent windows, last quarter held out). They describe recorded history, not a guarantee. `+
  `<b>Advisory intelligence</b> (LLM packet, US Money Index, event and news overlays) is shown as published, with its source and age, and is scored against reality on the Scorecards tab.`+
  ` <span class="muted">${esc(B.board_version)} · ${esc(B.config_version)}</span>`;
$("#fresh").innerHTML = `<span class="sub" style="font-weight:600">Inputs:</span> ` + Object.values(B.external).map(s =>
  `<span data-tip="${esc(`<b>${esc(s.name)}</b><br>${esc(s.path)}<br>as of ${esc(s.as_of||"—")} · age ${s.age_hours ?? "—"} h${s.note ? "<br>"+esc(s.note) : ""}`)}">${statusChip(s.status, s.name.split(" (")[0])}</span>`).join("") +
  `<span data-tip="Daily bars: historical_prices.sqlite (Polygon, split-adjusted)">${statusChip("FRESH", "Prices to " + B.as_of_session)}</span>` +

function etfRows(){
  const h = state.horizon, q = state.q.trim().toUpperCase();
  const p = B.intel.packet || {};
  const lead = new Set(p.sector_lead || []), avoid = new Set(p.sector_avoid || []);
  const out = [];
  B.groups.forEach(g => g.tickers.forEach(t => {
    const e = B.etfs[t]; if (!e) return;
    const m = e.metrics || {};
    if (state.group !== "ALL" && g.group !== state.group) return;
    if (q && !t.includes(q)) return;
    if (state.freshOnly && m.status !== "FRESH") return;
    const x = (e.evidence || {})[h] || null;
    out.push({t, g: g.group, m, x, p: e.pipeline, d: e.decision, o: e.options, tt: e.tastytrade, tag: lead.has(t) ? "LEAD" : avoid.has(t) ? "AVOID" : ""});
  }));
  return out;
}

  ["am","Analog mean", r => r.x?.analog?.mean_pct, r => `<span class="${cls(r.x?.analog?.mean_pct)}">${pct(r.x?.analog?.mean_pct)}</span>`],
  ["bm","Base mean", r => r.x?.base?.mean_pct, r => `<span class="${cls(r.x?.base?.mean_pct)}">${pct(r.x?.base?.mean_pct)}</span>`],
  ["ex","Excess", r => r.x?.excess_vs_base_pct, r => `<span class="${cls(r.x?.excess_vs_base_pct)}">${pct(r.x?.excess_vs_base_pct)}</span>`],
  ["hit","Up %", r => r.x?.analog?.hit_rate, r => isNum(r.x?.analog?.hit_rate) ? Math.round(100*r.x.analog.hit_rate)+"%" : "—"],

  ["tag","Packet", r => r.tag, r => r.tag === "LEAD" ? `<span class="chip up">lead</span>` : r.tag === "AVOID" ? `<span class="chip down">avoid</span>` : ""],
];
function renderEtfs(){
  const rows = etfRows();
  const groups = ["ALL", ...B.groups.map(g => g.group)];
  let body = "";
  if (state.sort){
    const col = COLS.find(c => c[0] === state.sort);
    rows.sort((a,b) => { const va = col[2](a), vb = col[2](b);
      if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
      return (va > vb ? 1 : va < vb ? -1 : 0) * state.sortDir; });
    body = rows.map(r => rowHtml(r)).join("");
  } else {
    let last = null;
    rows.forEach(r => { if (r.g !== last){ body += `<tr class="grp"><td colspan="${COLS.length}">${esc(r.g)}</td></tr>`; last = r.g; } body += rowHtml(r); });
  }
  $("#p-etfs").innerHTML = `
    <h2>ETF matrix <span class="sub">${rows.length} shown · lean and evidence columns for the selected horizon</span></h2>
    <div class="controls">
      ${horizonSeg("hz-etf")}
      <select id="grp" aria-label="Group">${groups.map(g => `<option ${g===state.group?"selected":""}>${esc(g)}</option>`).join("")}</select>
      <input type="search" id="q" placeholder="Filter ticker" value="${esc(state.q)}">
      <label class="sub"><input type="checkbox" id="fo" ${state.freshOnly?"checked":""}> current data only</label>
      ${state.sort ? `<button class="btn" id="unsort">Group view</button>` : ""}
    </div>
    <div class="table-wrap"><table><thead><tr>${COLS.map(c => `<th class="${["t","lean","hold","pipe","resp","ext"].includes(c[0])?"l":""}" data-k="${c[0]}">${c[1]}${state.sort===c[0]?(state.sortDir>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="note">Click a row for the condition-by-condition evidence. "Short history" ETFs have fewer than ${B.settings.evidence.min_history_sessions} sessions in the price store, so they show price data only. Leveraged, inverse and volatility products decay along their path, so their 5d and 20d leans are withheld ("Path-dependent"); the evidence is still shown. "Pipeline" is the latest full AVSHUNTER run (${esc(B.pipeline?.run_id||"none")}), shown read-only.</div>`;
  bindHorizon("hz-etf");
  $("#grp").onchange = e => { state.group = e.target.value; renderEtfs(); };
  $("#q").oninput = e => { state.q = e.target.value; const pos = e.target.selectionStart; renderEtfs(); const q = $("#q"); q.focus(); q.setSelectionRange(pos,pos); };
  $("#fo").onchange = e => { state.freshOnly = e.target.checked; renderEtfs(); };
  if ($("#unsort")) $("#unsort").onclick = () => { state.sort = null; renderEtfs(); };
  $("#p-etfs thead").onclick = e => { const th = e.target.closest("th"); if (!th) return; const k = th.dataset.k;
    state.sortDir = state.sort === k ? -state.sortDir : -1; state.sort = k; renderEtfs(); };
  $("#p-etfs tbody").onclick = e => { const tr = e.target.closest("tr.row"); if (tr) openDrawer(tr.dataset.t); };
}
const rowHtml = r => `<tr class="row ${state.selected===r.t?"sel":""}" data-t="${r.t}">${COLS.map(c => `<td class="${["t","lean","hold","pipe","resp","ext"].includes(c[0])?"l":""}">${c[3](r)}</td>`).join("")}</tr>`;

/* ---------- drawer ---------- */
function openDrawer(t){
  state.selected = t;
  const e = B.etfs[t]; const m = e.metrics || {};
  const h = state.horizon;
  const evRows = B.horizons.map(hh => { const x = (e.evidence||{})[String(hh)]; const a = x?.analog||{}, b = x?.base||{}, tr = x?.train||{}, ho = x?.holdout_stats||{};
    return `<tr><td>${hh}d</td><td class="l">${leanChip(x)}</td><td class="${cls(a.mean_pct)}">${pct(a.mean_pct)}</td><td>${ci(a)}</td><td>${pct(a.p10_pct,1)} … ${pct(a.p90_pct,1)}</td><td class="${cls(b.mean_pct)}">${pct(b.mean_pct)}</td><td class="l">${esc(LEAN_TXT[x?.baseline_lean]||x?.baseline_lean||"—")}</td><td>${fmt(tr.t)}</td><td class="${cls(ho.mean_pct)}">${pct(ho.mean_pct)} <span class="muted">(${ho.n_eff ?? 0})</span></td></tr>`; }).join("");
  const P = e.pipeline;
  const RM = P?.remaining;
  const remHtml = RM ? `<div class="warnbox" style="border-left-color:var(--accent)">From today's close ${fmt(m.close)}: <b>${pct(RM.to_target_pct)}</b> left to the pipeline target, <b>${pct(RM.to_invalidation_pct)}</b> to its invalidation${isNum(RM.target_consumed) ? ` · <b>${Math.round(100*RM.target_consumed)}%</b> of the entry→target move already used` : ""}. These are distances, not probabilities. Re-evaluate the entry if the move is largely consumed.</div>` : "";
  const pipeHtml = P ? `${remHtml}<dl class="kv">${Object.entries(P).filter(([k]) => k !== "remaining").map(([k,v]) => `<dt>${words(k)}</dt><dd style="text-align:left">${esc(v ?? "—")}</dd>`).join("")}</dl><div class="note">Run ${esc(B.pipeline?.run_id)} · written ${esc(B.pipeline?.written_utc)} · ${esc(B.pipeline?.file)}. Read-only: the board does not change or re-rank it.</div>` : `<div class="sub muted">${t} has no row in the latest full run (${esc(B.pipeline?.run_id||"none")}).</div>`;
  const O = e.options;
  const optHtml = O ? `<table class="mini" style="width:100%"><thead><tr><th class="l">H</th><th>Expiry</th><th>ATM</th><th>Straddle bid / mid / ask</th><th>Priced move (expiry)</th><th>Scaled to H</th><th>Analog |move|</th><th>Ratio</th><th>Spread</th></tr></thead><tbody>${B.horizons.map(hh => { const mv = (O.moves||{})[String(hh)];
      return mv ? `<tr><td>${hh}d</td><td>${mv.dte}d</td><td>${fmt(mv.strike,1)}</td><td>${fmt(mv.straddle_bid)} / ${fmt(mv.straddle_mid)} / ${fmt(mv.straddle_ask)}</td><td>${pct(mv.implied_move_pct,2,false)}</td><td>${pct(mv.implied_move_horizon_pct,2,false)}</td><td>${pct(mv.analog_mean_abs_pct,2,false)}</td><td>${isNum(mv.priced_vs_history)?fmt(mv.priced_vs_history,2)+"×":"—"}</td><td>${fmt(mv.spread_pct_of_mid,1)}%</td></tr>` : `<tr><td>${hh}d</td><td colspan="8" class="muted">no expiry covering the horizon</td></tr>`; }).join("")}</tbody></table>
      <div class="note">Quotes ${esc(O.quote_date)} (${O.sessions_old} session(s) before ${esc(B.as_of_session)}) ${O.status!=="FRESH"?statusChip(O.status):""}. Buying the straddle at the ask costs more than the mid shown. Contract choice stays with the pipeline's options stage.</div>` : `<div class="sub muted">No option chain stored for ${t}.</div>`;
  const D = e.decision || {};
  const R = (D.response||{})[h];
  const respHtml = R ? `${respChip(R)} <span class="sub">headwinds: ${esc((R.headwinds||[]).map(k=>condMeta[k]?.label||k).join(", ")||"none")} · tailwinds: ${esc((R.tailwinds||[]).map(k=>condMeta[k]?.label||k).join(", ")||"none")} · own ${h}d return ${pct(R.own_return_pct)}</span>` : "";
  const sens = (e.sensitivity || {})[h] || {};
  const vals = Object.values(sens).map(s => Math.abs(s.excess_pct || 0));
  const cap = Math.max(0.5, ...vals);
  const bars = B.conditions.meta.map(mm => { const s = sens[mm.key]; if (!s) return "";
    const v = s.excess_pct; const w = isNum(v) ? Math.abs(v) / cap * 50 : 0;
    const left = isNum(v) && v < 0 ? 50 - w : 50;
    const weak = !isNum(s.t) || Math.abs(s.t) < 1;
    return `<div>${esc(mm.label)}<div class="muted" style="font-size:11px">${words(s.state)}</div></div>
      <div class="track" data-tip="${esc(`<b>${esc(mm.label)}: ${words(s.state)}</b><br>Mean ${h}d return while in this state ${pct(s.mean_in_pct)} vs other observed states: excess ${pct(v)}<br>t ${fmt(s.t)} · ${s.n_eff_in} independent windows in state`)}">
        ${isNum(v) ? `<span class="bar" style="left:${left}%;width:${Math.max(1,w)}%;background:${v>=0?"var(--up)":"var(--down)"};opacity:${weak?.4:1}"></span>` : ""}</div>
      <div class="num ${cls(v)}" style="text-align:right">${isNum(v) ? pct(v) : "missing"}</div>`; }).join("");
  const d = $("#drawer");
  d.innerHTML = `<button class="btn close" id="dclose">Close ✕</button>
    <div class="state" style="font-size:20px">${t} <span class="sub">${esc(groupOf(t))}</span></div>
    <div class="sub num">${fmt(m.close)} · last bar ${esc(m.last_session)} ${m.status!=="FRESH"?statusChip(m.status):""} · ${m.history_sessions} sessions · avg $ volume 20d ${isNum(m.avg_dollar_volume_20d_m) ? (m.avg_dollar_volume_20d_m >= 1000 ? "$" + (m.avg_dollar_volume_20d_m/1000).toFixed(1) + "bn" : "$" + m.avg_dollar_volume_20d_m.toFixed(0) + "m") : "—"}</div>
    ${sparkSvg(m.spark, {label: t, color: "var(--text-2)", h: 70})}
    <h3 style="margin-top:12px">What the pipeline proposes</h3>${pipeHtml}
    <h3 style="margin-top:12px">Measured lean by horizon</h3>
    <div class="table-wrap" style="max-height:none"><table class="mini"><thead><tr><th class="l">H</th><th class="l">Lean</th><th>Analog mean</th><th>80% interval</th><th>10th…90th pct</th><th>Base mean</th><th class="l">Price-only lean</th><th>Train t</th><th>Holdout (win.)</th></tr></thead><tbody>${evRows}</tbody></table></div>
    ${e.path_dependent ? `<div class="warnbox">Path-dependent product: 5d and 20d leans are withheld. Daily reset or futures roll means multi-session history does not transfer mechanically.</div>` : ""}
    <h3 style="margin-top:12px">Stage of the move</h3>
    <div class="pill-row">${extChip((D.extension||{})["5"])} <span class="sub">5 sessions</span> ${extChip((D.extension||{})["20"])} <span class="sub">20 sessions · in units of the ETF's own realised vol (band ±${B.settings.extension.band_sd}σ)</span></div>
    <h3 style="margin-top:12px">What the option market charges</h3>${optHtml}
    <h3 style="margin-top:12px">Volatility metrics (tastytrade)</h3>${ttBlock(t)}
    ${e.holdings ? `<h3 style="margin-top:12px">Holdings · ${h}-session window</h3>${holdBlock(t, false)}` : ""}
    <h3 style="margin-top:12px">Response · ${h}-session window</h3><div class="pill-row">${respHtml}</div>
    <h3 style="margin-top:14px">Which conditions moved ${t} · ${h}-session horizon ${horizonSeg("hz-dr")}</h3>
    <div class="sub" style="margin-bottom:6px">Bar = mean forward return while each condition sat in today's state, minus its mean in the condition's other observed states. Faded bars have |t| below 1.</div>
    <div class="bars">${bars}</div>
    <div class="note">Each condition is measured on its own. They overlap (for example yields and the curve), so the bars do not add up.</div>`;
  d.classList.add("open"); d.setAttribute("aria-hidden","false");
  $("#dclose").onclick = closeDrawer;
  $("#hz-dr").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; state.horizon = b.dataset.h; savePrefs(); renderAll(); openDrawer(t); };
  document.querySelectorAll("tr.row").forEach(r => r.classList.toggle("sel", r.dataset.t === t));
}
function closeDrawer(){ const d = $("#drawer"); d.classList.remove("open"); d.setAttribute("aria-hidden","true"); state.selected = null; document.querySelectorAll("tr.row.sel").forEach(r => r.classList.remove("sel")); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ---------- transmission map ---------- */
function renderMap(){
  const h = state.horizon;
  const keys = B.conditions.meta.map(m => m.key);
  const tickers = [];
  B.groups.forEach(g => g.tickers.forEach(t => { const e = B.etfs[t]; if (e && e.metrics?.status === "FRESH" && e.evidence?.[h]?.lean !== "INSUFFICIENT_HISTORY" && e.sensitivity?.[h]) tickers.push(t); }));
  const all = tickers.flatMap(t => keys.map(k => Math.abs(B.etfs[t].sensitivity[h][k]?.excess_pct || 0)));
  const sorted = all.filter(isNum).sort((a,b)=>a-b);
  const cap = Math.max(0.2, sorted[Math.floor(sorted.length*0.95)] || 1);
  const cols = `minmax(64px,90px) repeat(${keys.length}, minmax(44px,1fr))`;
  let html = `<div class="heat" style="grid-template-columns:${cols}"><div></div>` + keys.map(k => `<div class="colh" title="${esc(condMeta[k].measured)}">${esc(condMeta[k].label)}: ${words(B.conditions.current[k])}</div>`).join("");
  let lastG = null;
  tickers.forEach(t => {
    if (groupOf(t) !== lastG){ lastG = groupOf(t); html += `<div class="lab" style="grid-column:1/-1;color:var(--text);font-weight:650;margin-top:6px">${esc(lastG)}</div>`; }
    html += `<div class="lab"><b>${t}</b></div>` + keys.map(k => { const s = B.etfs[t].sensitivity[h][k] || {}; const v = s.excess_pct;
      const weak = !isNum(s.t) || Math.abs(s.t) < 1;
      return `<div class="cell ${weak?"weak":""}" style="background:${divergingColor(v, cap)}" data-tip="${esc(`<b>${t} · ${esc(condMeta[k].label)} = ${words(s.state)}</b><br>Excess ${h}d return in this state: ${pct(v)}<br>t ${fmt(s.t)} · ${s.n_eff_in ?? 0} independent windows in state<br>Mean while in state ${pct(s.mean_in_pct)}`)}">${isNum(v) ? (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1)) : "×"}</div>`; }).join("");
  });
  html += `</div>`;
  $("#p-map").innerHTML = `<h2>Transmission map <span class="sub">how each ETF's forward return differed while each condition sat in today's state</span></h2>
    <div class="controls">${horizonSeg("hz-map")}
    <div class="legend"><span>${pct(-cap,1)}</span><span class="ramp"></span><span>${pct(cap,1)}</span><span>· faded = |t| &lt; 1 (weak) · × = condition missing</span></div></div>
    <div class="card" style="overflow:auto">${html}</div>
    <div class="note">Cell = mean ${h}-session return (next open → close) while the condition was in today's state, minus its mean in the condition's other observed states. Blue means the ETF did better, red worse. These are single-condition contrasts on overlapping windows, so use them to see where macro has been transmitting, not as stand-alone signals. Colour scale capped at the 95th percentile.</div>`;
  bindHorizon("hz-map");
}

/* ---------- scorecards ---------- */
function scoreTable(results){
  const tick = Object.keys(results || {});
  if (!tick.length) return `<div class="sub muted">No scorable calls.</div>`;
  return `<table class="mini" style="width:100%"><thead><tr><th class="l">ETF</th>${B.horizons.map(h=>`<th>${h}d hit</th><th>${h}d signed</th><th>${h}d win.</th>`).join("")}</tr></thead><tbody>${tick.map(t => `<tr><td class="l"><b>${t}</b></td>${B.horizons.map(h => { const r = results[t][String(h)] || {};
    const thin = (r.n_eff||0) < B.settings.evidence.min_effective_n;
    return `<td class="${thin?"muted":""}">${isNum(r.hit_rate)?Math.round(100*r.hit_rate)+"%":"—"}</td><td class="${cls(r.mean_signed_pct)}">${pct(r.mean_signed_pct)}</td><td class="${thin?"muted":""}">${r.n_eff ?? 0}${thin?" ?":""}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
}

  $("#p-score").innerHTML = `<h2>Scorecards <span class="sub">every macro call scored from the next tradable open · hit = direction matched the sign of the move · signed = return in the called direction · “?” = fewer than ${B.settings.evidence.min_effective_n} independent windows</span></h2>

      ${scoreTable(pk.results)}

/* ---------- method ---------- */
function renderMethod(){
  const E = B.settings.evidence, C = B.settings.conditions, c12 = B.settings.c12;
  const conds = B.conditions.meta.map(m => `<tr><td class="l"><b>${esc(m.label)}</b></td><td class="l" style="white-space:normal">${esc(m.measured)}</td><td class="l">${esc(m.states.map(s=>s.replace(/_/g," ")).join(" · "))}</td><td class="l">${esc(m.source)}</td></tr>`).join("");
  const lastObs = Object.entries(B.conditions.fred_last_observation).map(([k,v]) => `${esc(k)} ${esc(v||"—")}`).join(" · ");
  $("#p-method").innerHTML = `<h2>Method</h2>
  <div class="grid g-2">
    <div class="card" style="grid-column:1/-1"><h3>Conditions</h3><div class="table-wrap" style="max-height:none"><table class="mini"><thead><tr><th class="l">Condition</th><th class="l">What is measured</th><th class="l">States</th><th class="l">Source</th></tr></thead><tbody>${conds}</tbody></table></div>
      <p class="note">Trend, realised vol and breadth reuse the outcome scorer's definitions (${c12.trend.join("/")}-session means; ${c12.vol_sessions}-session vol percentile, bands ${c12.vol_bands.join("/")}; breadth over ${c12.breadth_sessions} sessions across ${B.price_universe_in_breadth} stored tickers, bands ${c12.breadth_bands.join("/")}). Moving conditions compare the ${C.change_sessions}-session change with its trailing ${C.zscore_window_sessions}-session standard deviation; beyond ±${C.trend_band_z} sd counts as moving. Curve level bands: ${C.curve_level_bands_pct.join(" / ")} pct points.</p>
      <p class="note">Latest FRED observations: ${lastObs}.</p></div>
    <div class="card"><h3>Point in time</h3><ul class="list">
      <li>FRED values become visible ${esc(JSON.stringify(Object.fromEntries(Object.entries(B.settings.fred_publication_lag_days).filter(([k])=>k!=="rationale"))))} calendar day(s) after their observation date.</li>
      <li>A series older than its freshness limit becomes MISSING. It is never carried forward or treated as neutral.</li>
      <li>Today's MISSING conditions are left out of the analog match. A past session's MISSING never counts as a match.</li>
      <li>Forward returns run from the next session's open to the close ${B.horizons.join("/")} sessions later.</li></ul></div>
    <div class="card"><h3>From evidence to lean</h3><ul class="list">
      <li>Analog sessions: past sessions agreeing with today on at least the chosen match level of observed conditions (${E.analog_match_levels.map(x=>Math.round(x*100)+"%").join(" → ")}, loosened until ≥ ${E.analog_target_effective_n} independent windows).</li>
      <li>Overlapping windows are thinned, so “windows” counts independent observations.</li>
      <li>The lean is fitted on history before the last ${Math.round(E.holdout_fraction*100)}%: it needs ≥ ${E.min_effective_n} windows, |t| ≥ ${E.lean_t_min} and |mean| ≥ ${esc(JSON.stringify(E.lean_min_abs_mean_pct))}%. Otherwise it shows “No clear lean”.</li>
      <li>The held-out quarter then shows whether the direction survived on data it never saw.</li>
      <li>ETFs need ≥ ${E.min_history_sessions} sessions of history for evidence.</li></ul></div>
    <div class="card"><h3>Decision aids (thesis review, 6 Oct)</h3><ul class="list">
      <li><b>80% interval</b>: Student-t interval for the analog mean on independent windows. The window minimum is a label, not a rule.</li>
      <li><b>Price-only lean</b>: the same rule applied to all history, with no macro. Compare it with the macro lean to see what macro adds.</li>
      <li><b>Path-dependent</b>: leveraged, inverse and volatility products show no 5d or 20d lean.</li>
      <li><b>Move made</b>: return over 5 and 20 sessions in units of the ETF's own 20-session realised vol. Beyond ±${B.settings.extension.band_sd}σ counts as extended. It says the entry may have deteriorated, not that the direction is wrong.</li>
      <li><b>Response</b>: conditions in today's state with a measured contrast of |t| ≥ ${B.settings.response.t_min} count as headwinds or tailwinds for that ETF. The label compares their balance with the ETF's own return over the window. It is descriptive only.</li>
      <li><b>Priced vs history</b>: executable ATM straddle mid on the first expiry covering the horizon, scaled by √time, divided by the analog mean absolute move.</li>
      <li><b>Pipeline</b>: rows from the newest run with <code>${esc(B.settings.options ? "options/options_candidates_ranked.csv" : "")}</code>, shown read-only.</li>
      <li><b>Holdings</b>: issuer daily files (State Street for SPY/DIA, Invesco for QQQ), downloaded on <code>--refresh</code> and archived raw. Contribution = weight × return; participation = share of priced weight above its ${B.settings.holdings.participation_sessions}-session mean.</li>
      <li><b>tastytrade</b>: IV index/rank/percentile, HV, beta and the IV term structure, read-only through <code>bridge.tastytrade_readonly_mcp</code>. IV-implied |move| = IV × √(h/252) × √(2/π).</li>
      <li><b>Inputs</b>: each build archives a content-addressed copy of every file it read (${B.inputs_archived ?? 0} this build) in <code>output/inputs</code>, with the manifest in the day's snapshot.</li></ul></div>
    <div class="card"><h3>Limits</h3><ul class="list">
      <li>About five years of daily history (from 2021-08), so one rate cycle. Analog sets are small and the evidence is thin by construction.</li>
      <li>FRED history is the latest vintage. Market series (yields, FX, H.4.1) are not revised; monthly prints are shown only, never used as conditions.</li>
      <li>Breadth uses the price store's own ticker universe, which grows over time.</li>
      <li>All thresholds are provisional. The board's own scorecard is how they get validated.</li></ul></div>
  </div>`;
}

/* ---------- sector rotation ---------- */
state.rotSet = state.rotSet || "sector";
const Q_TXT = {LEADING:"Leading", WEAKENING:"Weakening", LAGGING:"Lagging", IMPROVING:"Improving", MISSING:"Missing"};
const qChip = (q, extra) => `<span class="qchip q-${esc(q)}">${esc(Q_TXT[q] || q)}${extra ? ` <span class="muted">${extra}</span>` : ""}</span>`;
function rrgSvg(rows){
  const pts = rows.flatMap(r => r.tail.map(p => [p.trend, p.momentum]));
  if (!pts.length) return `<div class="sub muted">No rotation history.</div>`;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const spanX = Math.max(2, ...xs.map(x => Math.abs(x - 100))) * 1.12, spanY = Math.max(1, ...ys.map(y => Math.abs(y - 100))) * 1.12;
  const W = 640, H = 460, L = 44, R = 14, T = 14, Bm = 36;
  const X = x => L + (W - L - R) * (x - (100 - spanX)) / (2 * spanX);
  const Y = y => T + (H - T - Bm) * (1 - (y - (100 - spanY)) / (2 * spanY));
  const quad = (x0, y0, x1, y1, q, lx, ly, anchor) => `<rect x="${Math.min(X(x0),X(x1))}" y="${Math.min(Y(y0),Y(y1))}" width="${Math.abs(X(x1)-X(x0))}" height="${Math.abs(Y(y1)-Y(y0))}" class="q-${q}" style="fill:color-mix(in oklab, var(--q) 7%, var(--surface))"/>
    <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="12" font-weight="600" class="q-${q}" style="fill:var(--q)">${Q_TXT[q]}</text>`;
  let g = quad(100, 100, 100 + spanX, 100 + spanY, "LEADING", W - R - 6, T + 16, "end")
        + quad(100, 100 - spanY, 100 + spanX, 100, "WEAKENING", W - R - 6, H - Bm - 8, "end")
        + quad(100 - spanX, 100 - spanY, 100, 100, "LAGGING", L + 6, H - Bm - 8, "start")
        + quad(100 - spanX, 100, 100, 100 + spanY, "IMPROVING", L + 6, T + 16, "start");
  g += `<line x1="${X(100)}" x2="${X(100)}" y1="${T}" y2="${H-Bm}" stroke="var(--border)"/><line x1="${L}" x2="${W-R}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--border)"/>`;
  g += `<text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--text-2)">RS trend vs SPY (100 = at its ${B.rotation.settings.trend_sessions}-session average) →</text>`;
  g += `<text x="12" y="${(T+H-Bm)/2}" text-anchor="middle" font-size="12" fill="var(--text-2)" transform="rotate(-90 12 ${(T+H-Bm)/2})">RS momentum (${B.rotation.settings.momentum_sessions}-session change) →</text>`;
  rows.forEach(r => {
    const t = r.tail; if (!t.length) return;
    const d = t.map((p, i) => (i ? "L" : "M") + X(p.trend).toFixed(1) + " " + Y(p.momentum).toFixed(1)).join("");
    const head = t[t.length - 1];
    g += `<g class="q-${esc(r.quadrant)}"><path d="${d}" fill="none" stroke="var(--q)" stroke-width="1.6" stroke-opacity=".55"/>`
      + t.slice(0, -1).map(p => `<circle cx="${X(p.trend)}" cy="${Y(p.momentum)}" r="2.2" fill="var(--q)" fill-opacity=".45"/>`).join("")
      + `<circle cx="${X(head.trend)}" cy="${Y(head.momentum)}" r="5.5" fill="var(--q)" stroke="var(--surface)" stroke-width="2"/>`
      + `<text x="${X(head.trend) + 8}" y="${Y(head.momentum) + 4}" font-size="11.5" font-weight="600" fill="var(--text)">${esc(r.ticker)}</text>`
      + `<circle cx="${X(head.trend)}" cy="${Y(head.momentum)}" r="12" fill="transparent" data-tip="${esc(`<b>${esc(r.ticker)}</b> ${esc(r.sector_name||"")}<br>${esc(Q_TXT[r.quadrant])} for ${r.sessions_in_quadrant} sessions<br>RS trend ${fmt(r.trend,2)} · momentum ${fmt(r.momentum,2)}<br>vs SPY: 5d ${pct(r.rel_5d)} · 20d ${pct(r.rel_20d)} · 60d ${pct(r.rel_60d)}<br>Tail: weekly points ${esc(t[0].session)} → ${esc(head.session)}`)}"/></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:760px;height:auto;display:block" role="img" aria-label="Relative rotation map">${g}</svg>`;
}

    const agree = r.packet_agreement?.[h];
    return `<tr class="row" data-t="${esc(r.ticker)}"><td><b>${esc(r.ticker)}</b> <span class="muted">${esc((r.sector_name||"").toLowerCase())}</span></td>

      <td>${isNum(r.participation_pct) ? Math.round(r.participation_pct) + "%" : "—"}</td><td class="l muted">${esc((r.top_contributors_20d||[]).join(", "))}</td>
      <td class="l">${leanChip(e)} ${holdChip(e.holdout)}</td><td class="${cls(a.mean_pct)}">${pct(a.mean_pct)}</td><td class="muted">${ci(a)}</td>
      <td class="l">${r.packet_bias ? `<span class="chip ${r.packet_bias==="TAILWIND"?"up":r.packet_bias==="HEADWIND"?"down":"na"}">${words(r.packet_bias)}</span>` : "—"} ${agree ? `<span class="chip ${agree==="AGREES"?"":"na"}">${agree==="AGREES"?"✓ agrees":agree==="DISAGREES"?"✗ disagrees":"unmeasured"}</span>` : ""}</td></tr>`; }).join("");
  // macro-conditional ranking
  const ranked = rows.map(r => ({r, a: evOf(r).analog || {}, e: evOf(r)})).filter(x => isNum(x.a.mean_pct)).sort((x, y) => y.a.mean_pct - x.a.mean_pct);
  const cap = Math.max(0.5, ...ranked.flatMap(x => [Math.abs(x.a.ci_low_pct ?? 0), Math.abs(x.a.ci_high_pct ?? 0), Math.abs(x.a.mean_pct)]));
  const pos = v => 50 + 50 * Math.max(-1, Math.min(1, v / cap));
  const rank = ranked.map(x => { const a = x.a; const v = a.mean_pct;
    return `<div><b>${esc(x.r.ticker)}</b> <span class="muted" style="font-size:11px">${esc(LEAN_TXT[x.e.lean]||x.e.lean)}</span></div>
      <div class="track" data-tip="${esc(`<b>${esc(x.r.ticker)} vs SPY · next ${h} session(s) after sessions like today</b><br>Mean ${pct(v)} · 80% interval ${ci(a)}<br>Beat SPY ${isNum(a.hit_rate)?Math.round(100*a.hit_rate)+"%":"—"} · ${a.n_eff} independent windows<br>All history: ${pct(x.e.base?.mean_pct)}`)}">
        ${isNum(a.ci_low_pct) && isNum(a.ci_high_pct) ? `<span style="position:absolute;top:6px;height:2px;left:${pos(a.ci_low_pct)}%;width:${pos(a.ci_high_pct)-pos(a.ci_low_pct)}%;background:var(--text-2);opacity:.5"></span>` : ""}
        <span class="bar" style="left:${Math.min(pos(0),pos(v))}%;width:${Math.max(0.8,Math.abs(pos(v)-pos(0)))}%;background:${v>=0?"var(--up)":"var(--down)"}"></span></div>
      <div class="num ${cls(v)}" style="text-align:right">${pct(v)}</div>`; }).join("");
  // sector x condition (relative)
  const keys = B.conditions.meta.map(m => m.key);
  const allV = rows.flatMap(r => keys.map(k => Math.abs(r.relative_sensitivity[h]?.[k]?.excess_pct || 0))).filter(isNum).sort((a,b)=>a-b);
  const hcap = Math.max(0.2, allV[Math.floor(allV.length*0.95)] || 1);
  let heat = `<div class="heat" style="grid-template-columns:minmax(64px,80px) repeat(${keys.length}, minmax(44px,1fr))"><div></div>` + keys.map(k => `<div class="colh">${esc(condMeta[k].label)}: ${words(B.conditions.current[k])}</div>`).join("");
  rows.forEach(r => { heat += `<div class="lab"><b>${esc(r.ticker)}</b></div>` + keys.map(k => { const c = r.relative_sensitivity[h]?.[k] || {}; const v = c.excess_pct; const weak = !isNum(c.t) || Math.abs(c.t) < 1;
    return `<div class="cell ${weak?"weak":""}" style="background:${divergingColor(v, hcap)}" data-tip="${esc(`<b>${esc(r.ticker)} vs SPY · ${esc(condMeta[k].label)} = ${words(c.state)}</b><br>Excess ${h}d relative return in this state: ${pct(v)}<br>t ${fmt(c.t)} · ${c.n_eff_in ?? 0} independent windows`)}">${isNum(v) ? (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1)) : "×"}</div>`; }).join(""); });
  heat += `</div>`;
  // quadrant evidence + transitions
  const QE = R.quadrant_evidence[h] || {};
  const qe = ["LEADING","WEAKENING","LAGGING","IMPROVING","ALL"].map(q => { const x = QE[q] || {};
    return `<tr><td class="l">${q==="ALL" ? "<b>All sessions</b>" : qChip(q)}</td><td class="${cls(x.mean_pct)}">${pct(x.mean_pct)}</td><td class="muted">${ci({ci_low_pct:x.ci_low_pct, ci_high_pct:x.ci_high_pct})}</td><td>${isNum(x.beat_rate)?Math.round(100*x.beat_rate)+"%":"—"}</td><td>${x.n_eff ?? 0}</td></tr>`; }).join("");
  const T = R.transitions;
  const trans = ["LEADING","WEAKENING","LAGGING","IMPROVING"].map(a => { const row = T[a] || {}; const tot = Object.values(row).reduce((s,v)=>s+v,0);
    return `<tr><td class="l">${qChip(a)}</td>${["LEADING","WEAKENING","LAGGING","IMPROVING"].map(b => `<td style="${a===b?"font-weight:650":""}">${tot ? Math.round(100*row[b]/tot)+"%" : "—"}</td>`).join("")}<td class="muted">${tot}</td></tr>`; }).join("");
  // packet scorecard
  const P = R.packet || {}, LL = R.lead_lag_scorecard || {};
  const llRows = B.horizons.map(hh => { const x = (LL.results||{})[String(hh)] || {}; const thin = (x.n_eff||0) < B.settings.evidence.min_effective_n;
    return `<tr><td>${hh}d</td><td>${x.n ?? 0}</td><td class="${thin?"muted":""}">${x.n_eff ?? 0}${thin?" ?":""}</td><td>${isNum(x.hit_rate)?Math.round(100*x.hit_rate)+"%":"—"}</td><td class="${cls(x.mean_spread_pct)}">${pct(x.mean_spread_pct)}</td></tr>`; }).join("");
  $("#p-rotation").innerHTML = `<h2>Sector rotation <span class="sub">relative strength vs SPY and the macro's measured impact on it</span></h2>
    <div class="controls">${horizonSeg("hz-rot")} <span class="seg" id="rot-set"><button data-s="sector" aria-pressed="${state.rotSet==="sector"}">SPDR sectors</button><button data-s="industry" aria-pressed="${state.rotSet==="industry"}">Industries & themes</button></span></div>
    <div class="grid g-2">
      <div class="card"><h3>Rotation map <span class="sub">weekly tail, last ${B.rotation.settings.tail_points} points</span></h3>${rrgSvg(rows)}
        <div class="legend">${["LEADING","WEAKENING","LAGGING","IMPROVING"].map(q => qChip(q)).join(" ")}</div>
        <div class="note">Transparent approximation of a relative-rotation graph, not the proprietary JdK RS-Ratio. RS trend = 100 × (ETF/SPY) ÷ its ${B.rotation.settings.trend_sessions}-session mean. RS momentum = 100 × RS trend ÷ its value ${B.rotation.settings.momentum_sessions} sessions earlier. Sectors usually move clockwise: improving → leading → weakening → lagging.</div></div>
      <div class="card"><h3>Macro-conditional ranking · next ${h} session(s) vs SPY</h3>
        <div class="sub" style="margin-bottom:6px">Mean return relative to SPY after past sessions whose macro conditions matched today's (${Math.round(B.analogs.match_level*100)}% match, ${B.analogs.count} sessions). The whisker is the 80% interval.</div>
        <div class="bars" style="grid-template-columns:minmax(90px,150px) 1fr 70px">${rank || `<div class="sub muted">No measurable sectors.</div>`}</div>
        <div class="note">Each lean uses relative thresholds (|mean| ≥ ${esc(JSON.stringify(B.rotation.settings.relative_lean_min_abs_mean_pct))}%, |t| ≥ ${B.settings.evidence.lean_t_min}) and is checked on held-out history.</div></div>
    </div>
    <h2>Rotation table</h2>
    <div class="table-wrap"><table><thead><tr><th>ETF</th><th class="l">Quadrant</th><th>RS trend</th><th>Momentum</th><th>vs SPY 5d</th><th>20d</th><th>60d</th><th>Participation</th><th class="l">Leading holdings 20d</th><th class="l">Macro lean ${h}d</th><th>Analog vs SPY</th><th>80% interval</th><th class="l">Packet bias</th></tr></thead><tbody>${table}</tbody></table></div>
    <div class="note">Participation = share of the ETF's weight (issuer daily holdings) trading above its ${B.settings.holdings.participation_sessions}-session mean. "Packet bias" is the LLM packet's sector_bias_map, compared with the measured macro lean: ✓ agrees, ✗ disagrees, or unmeasured when the evidence shows no clear lean.</div>
    <h2>Macro impact on sectors · ${h}-session relative returns</h2>
    <div class="card" style="overflow:auto">${heat}</div>
    <div class="note">Cell = mean ${h}-session return relative to SPY while the condition sat in today's state, minus the same in the condition's other states. Blue = the sector did better relative to SPY. Faded = |t| &lt; 1.</div>
    <div class="grid g-2" style="margin-top:10px">
      <div class="card"><h3>Does the quadrant predict the next ${h} session(s)?</h3>
        <table class="mini" style="width:100%"><thead><tr><th class="l">Quadrant</th><th>Mean vs SPY</th><th>80% interval</th><th>Beat SPY</th><th>Windows</th></tr></thead><tbody>${qe}</tbody></table>
        <div class="note">Pooled over the 11 SPDR sectors since 2021. Compare each quadrant with "All sessions": over this period sectors lagged SPY on average, because SPY is concentrated in mega-cap tech.</div></div>
      <div class="card"><h3>Where quadrants go next (${B.rotation.settings.transition_step_sessions} sessions later)</h3>
        <table class="mini" style="width:100%"><thead><tr><th class="l">From \ to</th><th>Leading</th><th>Weakening</th><th>Lagging</th><th>Improving</th><th>n</th></tr></thead><tbody>${trans}</tbody></table>
        <div class="note">Measured transition rates for the 11 SPDR sectors. Bold = stayed in the same quadrant.</div></div>
      <div class="card"><h3>LLM packet sector calls</h3>
        <div class="sub">Rotation signal <b>${words(P.signal)}</b> · strongest ${esc((P.strongest||[]).join(", ")||"—")} · weakest ${esc((P.weakest||[]).join(", ")||"—")} ${uncal}</div>
        <table class="mini" style="width:100%;margin-top:6px"><thead><tr><th class="l">H</th><th>Calls</th><th>Windows</th><th>Lead beat lag</th><th>Mean spread</th></tr></thead><tbody>${llRows}</tbody></table>
        <details style="margin-top:6px"><summary>Latest archived calls</summary><ul class="list">${(LL.latest||[]).map(c => `<li>${esc(c.entry_session)}: lead ${esc(c.lead.join(", "))} · lag ${esc(c.lag.join(", "))}</li>`).join("")}</ul></details>
        <div class="note">Scored from each archived generation's leading_sectors vs lagging_sectors (latest wins per session): equal-weight lead basket minus lag basket, next open → close.</div></div>
    </div>`;
  bindHorizon("hz-rot");
  $("#rot-set").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.rotSet = b.dataset.s; renderRotation(); };
  $("#p-rotation tbody").onclick = e => { const tr = e.target.closest("tr.row"); if (tr && B.etfs[tr.dataset.t]) openDrawer(tr.dataset.t); };
}

function renderAll(){
  renderOverview(); renderEtfs(); renderMap(); renderRotation(); renderIntel(); renderScore(); renderMethod();
}
renderAll();
let start = "overview"; try { start = localStorage.getItem("macroBoardPage") || start; } catch(e) {}
show(PAGES.some(p => p[0]===start) ? start : "overview");
})();
</script>
</body>
</html>
